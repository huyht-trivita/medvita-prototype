@media (max-width: 1240px) { .sheet-wrap { grid-template-columns: 1fr; } .ai-panel { position: static; max-height: none; } }
`);

  const views = {};
  const chats = {};
  let dict = null;

  function viewOf(epId, date) {
    const k = epId + '|' + date;
    if (!views[k]) views[k] = { mode: 'edit', active: 'dienbien' };
    return views[k];
  }
  function label(id) { return D.SHEET_FIELDS.find(function (f) { return f.id === id; }).label; }
  function drugs() { return M3.store.get().drugs; }
  function me() { return M3.sel.currentUser(); }
  function canEdit(user, id) { return D.can(user.role, id === 'chamsoc' ? 'sheet.editCare' : 'sheet.edit'); }
  function ctxLine(date, id) { return 'Tờ ' + ui.fmtShort(date) + ' · ô đang chọn: ' + label(id); }
  const PLACEHOLDER = {
    dienbien: 'Triệu chứng, toàn thân, thực thể, lượng giá chức năng…',
    ylenh: 'Mỗi thuốc / chỉ định một dòng: tên, hàm lượng, liều, đường dùng, giờ dùng…',
    chamsoc: 'Cấp chăm sóc, chế độ ăn, theo dõi…',
  };

  // ---------- thay đổi dữ liệu ----------
  function mutate(epId, date, fn, opts) {
    M3.store.update(function () {
      const ep = M3.sel.episode(epId);
      fn(ep, M3.ensureSheet(ep, date));
    }, opts);
  }

  function onType(epId, date, fieldId, text) {
    let statusChanged = false;
    mutate(epId, date, function (ep, sh) {
      sh.fields[fieldId].text = text;
      sh.savedAt = M3.now();
      if (sh.status === 'empty' && text.trim()) { sh.status = 'draft'; statusChanged = true; }
    }, { silent: true });
    const note = document.getElementById('save-note');
    if (note) note.textContent = 'Đang lưu nháp…';
    M3.app.debounce('sheet-type', function () { M3.app.render(); }, statusChanged ? 50 : 800);
  }

  function insertContent(epId, date, fieldId, text, provenance, o) {
    o = o || {};
    mutate(epId, date, function (ep, sh) {
      const f = sh.fields[fieldId];
      const wasPending = f.aiPending;
      const append = o.mode !== 'replace' && D.hasText(f.text);
      f.prevText = f.text;
      f.prevProvenance = f.provenance || [];
      f.text = append ? f.text.replace(/\s+$/, '') + '\n' + text : text;
      f.provenance = (append ? f.provenance || [] : []).concat(provenance || []);
      f.aiPending = !o.manual || Boolean(wasPending && append);
      if (o.ack) f.ack = Object.assign({}, append ? f.ack || {} : {}, o.ack);
      sh.savedAt = M3.now();
      if (sh.status === 'empty') sh.status = 'draft';
      M3.log(ep, o.action || 'AI chèn nội dung — chờ duyệt', label(fieldId) + ' · tờ ' + ui.fmtShort(date));
    });
  }

  function approve(epId, date, fieldId) {
    mutate(epId, date, function (ep, sh) {
      const f = sh.fields[fieldId];
      f.aiPending = false;
      delete f.prevText;
      delete f.prevProvenance;
      M3.log(ep, 'Duyệt nội dung AI', label(fieldId) + ' · tờ ' + ui.fmtShort(date));
    });
    ui.toast('Đã duyệt nội dung AI ở ô ' + label(fieldId));
  }

  function discard(epId, date, fieldId) {
    mutate(epId, date, function (ep, sh) {
      const f = sh.fields[fieldId];
      f.text = f.prevText || '';
      f.provenance = f.prevProvenance || [];
      f.aiPending = false;
      delete f.prevText;
      delete f.prevProvenance;
      M3.log(ep, 'Bỏ nội dung AI', label(fieldId) + ' · tờ ' + ui.fmtShort(date));
    });
    ui.toast('Đã bỏ nội dung AI, khôi phục nội dung trước đó');
  }

  function orderBlockers(sh) {
    const f = sh.fields.ylenh;
    const ack = f.ack || {};
    return D.orderIssues(f.text, drugs()).filter(function (r) { return !ack[r.line]; }).map(function (r) {
      return { fieldId: 'ylenh', reason: 'order', message: 'Y lệnh "' + r.line + '": ' + r.issues.map(function (i) { return i.message; }).join('; ') };
    });
  }

  // ---------- hỏi lại trước khi chèn ----------
  function askMode(fieldLabel) {
    return new Promise(function (resolve) {
      let done = false;
      const pick = function (m, v) { done = true; m.close(); resolve(v); };
      ui.modal({
        title: 'Ô "' + fieldLabel + '" đã có nội dung', icon: 'info',
        body: h('p', null, 'AI không tự ghi đè nội dung đã có. Chọn chèn thêm vào cuối, hoặc thay thế (nội dung cũ khôi phục được bằng "Bỏ nội dung AI").'),
        actions: [
          { label: 'Hủy', onClick: function (m) { m.close(); } },
          { label: 'Thay thế', onClick: function (m) { pick(m, 'replace'); } },
          { label: 'Chèn thêm vào cuối', kind: 'primary', onClick: function (m) { pick(m, 'append'); } },
        ],
        onClose: function () { if (!done) resolve(null); },
      });
    });
  }

  // Kiểm soát Y lệnh (F3-073): dòng vượt ngưỡng phải sửa hoặc ghi lý do mới chèn được.
  function checkThen(text, onOk) {
    const issues = D.orderIssues(text, drugs());
    if (!issues.length) { onOk(text, {}); return; }
    const lines = text.split('\n');
    const rows = issues.map(function (r) {
      return {
        r: r, idx: r.lineNo - 1,
        input: h('input', { class: 'input mono', value: lines[r.lineNo - 1], 'aria-label': 'Sửa dòng Y lệnh ' + r.lineNo }),
        reason: h('input', { class: 'input', placeholder: 'Hoặc ghi lý do giữ nguyên liều này…', 'aria-label': 'Lý do giữ nguyên dòng ' + r.lineNo }),
      };
    });
    const err = h('div', { class: 'form-error', role: 'alert' });
    ui.modal({
      title: 'Kiểm tra Y lệnh trước khi chèn', icon: 'alert', size: 'lg', persistent: true,
      subtitle: 'Có ' + issues.length + ' dòng vượt ngưỡng hoặc sai đơn vị. Sửa dòng, hoặc ghi lý do nếu giữ nguyên.',
      body: h('div', { class: 'stack' },
        rows.map(function (x) {
          return h('div', { class: 'order-fix' },
            h('div', { class: 'strong small' }, 'Dòng ' + x.r.lineNo + (x.r.drug ? ' · ' + x.r.drug : '')),
            h('ul', { class: 'order-msgs' }, x.r.issues.map(function (i) { return h('li', null, i.message); })),
            x.input, x.reason);
        }),
        h('div', { class: 'tiny muted' }, 'Ngưỡng liều trong prototype là ngưỡng demo, không dùng cho lâm sàng. Quy tắc thật do bác sĩ chuyên môn chốt (D-05).'),
        err),
      actions: [
        { label: 'Hủy', onClick: function (m) { m.close(); } },
        {
          label: 'Chèn sau khi kiểm tra', kind: 'primary', icon: 'check',
          onClick: function (m) {
            rows.forEach(function (x) { lines[x.idx] = x.input.value; });
            const finalText = lines.join('\n');
            const ack = {};
            const left = D.orderIssues(finalText, drugs()).filter(function (r) {
              const row = rows.find(function (x) { return x.idx === r.lineNo - 1; });
              const why = row ? row.reason.value.trim() : '';
              if (why) { ack[r.line] = why; return false; }
              return true;
            });
            if (left.length) { err.textContent = 'Còn ' + left.length + ' dòng vượt ngưỡng chưa sửa hoặc chưa ghi lý do.'; return; }
            m.close();
            onOk(finalText, ack);
          },
        },
      ],
    });
  }

  function remap(prov, oldText, newText) {
    if (oldText === newText) return prov || [];
    const a = oldText.split('\n');
    const b = newText.split('\n');
    return (prov || []).map(function (p) {
      const i = a.indexOf(p.sentence);
      return i !== -1 && b[i] != null ? { sentence: b[i], sourceId: p.sourceId } : p;
    });
  }

  async function place(ep, date, fieldId, text, provenance, o) {
    o = o || {};
    const sh = ep.sheets[date];
    let mode = o.mode || 'append';
    if (!o.mode && sh && D.hasText(sh.fields[fieldId].text)) {
      mode = await askMode(label(fieldId));
      if (!mode) return;
    }
    const go = function (finalText, ack) {
      insertContent(ep.id, date, fieldId, finalText, remap(provenance, text, finalText), Object.assign({}, o, { mode: mode, ack: ack }));
      ui.toast(o.manual ? 'Đã chèn vào ' + label(fieldId) : 'Đã chèn vào ' + label(fieldId) + ' — bản nháp AI chờ duyệt');
    };
    if (fieldId === 'ylenh') checkThen(text, go);
    else go(text, {});
  }

  // ---------- trợ lý ----------
  function pushMsg(epId, msg) {
    (chats[epId] = chats[epId] || []).push(msg);
    return msg;
  }

  function aiFail(epId, e) {
    pushMsg(epId, { role: 'ai', kind: e.code === 'AI_DOWN' ? 'error' : 'refusal', text: e.message, code: e.code });
    ui.toast(e.message, e.code === 'AI_DOWN' ? 'error' : 'warn');
    M3.app.render();
  }

  async function ask(ep, date, prompt) {
    pushMsg(ep.id, { role: 'user', text: prompt });
    const pending = pushMsg(ep.id, { role: 'ai', pending: true });
    M3.app.render();
    try {
      const r = await M3.ai.chat(ep, date, prompt);
      Object.assign(pending, { pending: false }, r);
      if (r.kind === 'action' && r.action === 'inherit') {
        Object.assign(pending, { kind: 'info', text: 'Mở bảng dựng tờ ' + ui.fmtShort(date) + ' từ tờ hôm trước.' });
        startInherit(ep, date);
      } else if (r.kind === 'action' && r.action === 'checkOrders') {
        Object.assign(pending, { kind: 'info', text: 'Mở kết quả kiểm tra Y lệnh của tờ ' + ui.fmtShort(date) + '.' });
        showOrderCheck(ep, date);
      }
    } catch (e) {
      Object.assign(pending, { pending: false, kind: e.code === 'AI_DOWN' ? 'error' : 'refusal', text: e.message, code: e.code });
    }
    M3.app.render();
  }

  async function suggest(ep, date, fieldId) {
    ui.toast('Trợ lý đang soạn gợi ý cho ô ' + label(fieldId) + '…');
    let r;
    try { r = await M3.ai.suggestField(ep, date, fieldId); } catch (e) { aiFail(ep.id, e); return; }
    const ta = h('textarea', { class: 'textarea', id: 'sug-text', 'aria-label': 'Nội dung gợi ý', value: r.text });
    ui.modal({
      title: r.title, subtitle: 'Gợi ý cho ô ' + label(fieldId) + ' · tờ ' + ui.fmtShort(date), icon: 'sparkle', size: 'lg',
      body: h('div', { class: 'stack' },
        ui.fieldBox('Nội dung gợi ý (sửa được trước khi chèn)', ui.autoGrow(ta)),
        h('div', null, h('div', { class: 'label', style: { marginBottom: '6px' } }, 'Nguồn AI đã dùng cho từng câu'),
          h('div', { class: 'src-list' }, r.provenance.map(function (p) { return h('div', { class: 'src-row' }, h('span', { class: 'grow' }, p.sentence), ui.srcTag(ep, p.sourceId)); })))),
      note: 'Nội dung do AI soạn — bác sĩ chịu trách nhiệm kiểm tra trước khi xác nhận.',
      actions: [
        { label: 'Hủy', onClick: function (m) { m.close(); } },
        { label: 'Chèn vào ' + label(fieldId), kind: 'primary', icon: 'check', onClick: function (m) { m.close(); place(ep, date, fieldId, ta.value, r.provenance); } },
      ],
    });
  }

  function startInherit(ep, date) {
    const sh = ep.sheets[date];
    if (sh && D.isLocked(sh.status)) { ui.toast('Tờ đã xác nhận — bấm "Sửa tiếp" trước', 'warn'); return; }
    if (sh && D.SHEET_FIELDS.some(function (d) { return D.hasText(sh.fields[d.id].text); })) {
      ui.confirm({
        title: 'Tờ hôm nay đã có nội dung',
        message: 'Dựng lại từ tờ hôm trước sẽ thay nội dung cả 3 ô. Nội dung hiện tại khôi phục được bằng "Bỏ nội dung AI" ở từng ô.',
        okLabel: 'Dựng lại',
      }).then(function (ok) { if (ok) openInherit(ep, date); });
      return;
    }
    openInherit(ep, date);
  }

  // Dựng tờ hôm nay từ tờ hôm trước (F3-074): bác sĩ chọn dòng mang sang.
  async function openInherit(ep, date) {
    let res;
    try { res = await M3.ai.inheritProposal(ep, date); } catch (e) { aiFail(ep.id, e); return; }
    const prevLabel = ui.fmtShort(res.prevDate);
    const lines = res.lines;
    function srcLabel(id) {
      const i = id ? M3.sel.sourceInfo(ep, id) : null;
      return i ? i.label : 'không còn hiệu lực';
    }
    function lineEl(l) {
      let el = null;
      const cb = h('input', { type: 'checkbox', checked: l.checked, onChange: function (e) { l.checked = e.target.checked; el.classList.toggle('off', !l.checked); } });
      const tagText = l.kind === 'keep' ? 'Giữ từ tờ ' + prevLabel
        : l.kind === 'changed' ? 'Cập nhật · ' + srcLabel(l.sourceId)
          : l.kind === 'new' ? 'Mới · ' + srcLabel(l.sourceId)
            : 'Đề xuất bỏ · ' + srcLabel(l.sourceId);
      el = h('label', { class: 'inh-line ' + l.kind + (l.checked ? '' : ' off') }, cb,
        h('div', { class: 'grow' },
          h('div', { class: 'inh-text' }, l.text),
          l.old ? h('div', { class: 'inh-old' }, 'Tờ ' + prevLabel + ': ' + l.old) : null,
          h('div', { class: 'inh-meta' }, h('span', { class: 'tag ' + (l.kind === 'keep' ? '' : l.kind === 'drop' ? 'warn' : 'ok') }, tagText))));
      return el;
    }
    function apply(m) {
      const ylText = lines.ylenh.filter(function (l) { return l.checked; }).map(function (l) { return l.text; }).join('\n');
      const finish = function (finalYl, ack) {
        const finalLines = finalYl.split('\n');
        mutate(ep.id, date, function (e, sh) {
          D.SHEET_FIELDS.forEach(function (d) {
            const f = sh.fields[d.id];
            const checked = lines[d.id].filter(function (l) { return l.checked; });
            const text = d.id === 'ylenh' ? finalYl : checked.map(function (l) { return l.text; }).join('\n');
            f.prevText = f.text;
            f.prevProvenance = f.provenance || [];
            f.text = text;
            f.provenance = checked.map(function (l, i) {
              return { sentence: d.id === 'ylenh' ? (finalLines[i] || l.text) : l.text, sourceId: l.sourceId || 'sheet:' + res.prevDate };
            });
            f.aiPending = D.hasText(text);
            if (d.id === 'ylenh') f.ack = ack;
          });
          sh.savedAt = M3.now();
          if (sh.status === 'empty') sh.status = 'draft';
          M3.log(e, 'Dựng tờ từ tờ ' + prevLabel + ' (bản nháp AI)', 'Tờ ' + ui.fmtShort(date));
        });
        pushMsg(ep.id, { role: 'ai', kind: 'info', title: 'Đã dựng tờ ' + ui.fmtShort(date), text: 'Nội dung kế thừa tờ ' + prevLabel + ' và cập nhật từ dữ liệu mới đã vào 3 ô dưới dạng bản nháp AI. Duyệt từng ô (✓) trước khi xác nhận tờ.' });
        M3.app.render();
        ui.toast('Đã dựng tờ ' + ui.fmtShort(date) + ' — duyệt từng ô trước khi xác nhận');
      };
      m.close();
      if (D.orderIssues(ylText, drugs()).length) checkThen(ylText, finish);
      else finish(ylText, {});
    }
    ui.modal({
      title: 'Dựng tờ ' + ui.fmtShort(date) + ' từ tờ ' + prevLabel, icon: 'sparkle', size: 'lg',
      subtitle: 'Giữ phần còn hiệu lực, cập nhật từ dữ liệu 24 giờ qua. Bỏ chọn dòng không muốn mang sang.',
      body: h('div', { class: 'stack' },
        h('div', { class: 'inh-legend' },
          h('span', { class: 'tag' }, 'Giữ từ tờ ' + prevLabel), h('span', { class: 'tag ok' }, 'Cập nhật / mới — có nguồn'), h('span', { class: 'tag warn' }, 'Đề xuất bỏ')),
        D.SHEET_FIELDS.map(function (d) {
          return h('div', { class: 'inh-field' }, h('h3', null, d.label),
            lines[d.id].length ? lines[d.id].map(lineEl) : h('div', { class: 'empty', style: { padding: '12px' } }, 'Tờ trước không có nội dung.'));
        })),
      note: 'Bản nháp AI — bác sĩ duyệt từng ô trước khi xác nhận tờ. Y lệnh được kiểm tra liều trước khi chèn.',
      actions: [
        { label: 'Hủy', onClick: function (m) { m.close(); } },
        { label: 'Đưa vào tờ ' + ui.fmtShort(date), kind: 'primary', icon: 'check', onClick: apply },
      ],
    });
  }

  function showOrderCheck(ep, date) {
    const sh = ep.sheets[date];
    const f = sh ? sh.fields.ylenh : { text: '', ack: {} };
    const res = D.checkOrders(f.text, drugs());
    ui.modal({
      title: 'Kiểm tra Y lệnh', icon: 'check',
      subtitle: 'Đối chiếu danh mục thuốc demo: tên thuốc, đơn vị, liều mỗi lần, tổng liều / ngày.',
      body: res.length
        ? h('div', { class: 'list' }, res.map(function (r) {
          const why = (f.ack || {})[r.line];
          return h('div', { class: 'list-item' }, ui.icon(r.issues.length ? 'alert' : 'check'),
            h('div', { class: 'grow' }, h('div', { class: 'mono' }, r.line),
              r.issues.length
                ? h('div', { class: 'small', style: { color: 'var(--red)' } }, r.issues.map(function (i) { return i.message; }).join('; '), why ? ' — bác sĩ giữ nguyên, lý do: ' + why : '')
                : h('div', { class: 'small muted' }, r.drug + ': trong ngưỡng')));
        }))
        : h('div', { class: 'empty' }, 'Chưa có dòng thuốc nào để kiểm tra.'),
      note: 'Ngưỡng liều là ngưỡng demo. Quy tắc thật do bác sĩ chuyên môn chốt (D-05).',
      actions: [{ label: 'Đóng', onClick: function (m) { m.close(); } }],
    });
  }

  function copyPrevOrders(ep, date) {
    const ds = M3.sel.sheetDates(ep).filter(function (d) { return d < date && D.hasText(ep.sheets[d].fields.ylenh.text); }).reverse().slice(0, 3);
    if (!ds.length) { ui.toast('Chưa có Y lệnh tờ trước', 'warn'); return; }
    let pick = ds[0];
    ui.modal({
      title: 'Chép Y lệnh tờ trước', icon: 'copy', size: 'lg',
      subtitle: 'Chọn Y lệnh đã ghi để chép sang tờ ' + ui.fmtShort(date) + '. Y lệnh được kiểm tra lại trước khi chèn.',
      body: h('div', { class: 'stack' }, ds.map(function (d, i) {
        return h('label', { class: 'pick' },
          h('input', { type: 'radio', name: 'rx-pick', checked: i === 0, onChange: function () { pick = d; } }),
          h('div', { class: 'grow' },
            h('div', { class: 'strong' }, 'Y lệnh ' + ui.fmtDate(d), i === 0 ? h('span', { class: 'tag', style: { marginLeft: '6px' } }, 'gần nhất') : null),
            h('div', { class: 'pre small' }, ep.sheets[d].fields.ylenh.text)));
      })),
      actions: [
        { label: 'Hủy', onClick: function (m) { m.close(); } },
        {
          label: 'Chèn vào Y lệnh', kind: 'primary',
          onClick: function (m) {
            m.close();
            const t = ep.sheets[pick].fields.ylenh.text;
            place(ep, date, 'ylenh', t, D.splitLines(t).map(function (l) { return { sentence: l, sourceId: 'sheet:' + pick }; }), { manual: true, action: 'Chép Y lệnh tờ ' + ui.fmtShort(pick) });
          },
        },
      ],
    });
  }

  // ---------- đọc chính tả ----------
  function startDictation(ep, date, fieldId) {
    if (dict) { ui.toast('Đang đọc chính tả ở ô khác — dừng trước đã', 'warn'); return; }
    let ctrl;
    try {
      ctrl = M3.ai.dictate(M3.ai.dictationText(ep, fieldId),
        function (t) {
          if (!dict) return;
          dict.live = t;
          const el = document.getElementById('dict-live');
          if (el) el.textContent = t;
        },
        function (finalText) { finishDictation(ep.id, date, fieldId, finalText); });
    } catch (e) {
      ui.toast(e.message, 'warn');
      return;
    }
    dict = { epId: ep.id, date: date, fieldId: fieldId, ctrl: ctrl, paused: false, live: '' };
    M3.app.render();
  }

  function finishDictation(epId, date, fieldId, text) {
    dict = null;
    const sid = M3.uid('S');
    M3.store.update(function () {
      const e = M3.sel.episode(epId);
      e.sources.push({
        id: sid, type: 'audio', label: 'Đọc chính tả ' + M3.now().slice(11, 16) + ' · ' + label(fieldId), at: M3.now(), by: me().id,
        content: text, duration: '0:' + String(Math.min(59, Math.max(3, Math.round(text.length / 12)))).padStart(2, '0'),
      });
    }, { silent: true });
    place(M3.sel.episode(epId), date, fieldId, text, D.sentences(text).map(function (s) { return { sentence: s, sourceId: sid }; }),
      { mode: 'append', action: 'Đọc chính tả vào ô (chờ duyệt)' });
    M3.app.render();
  }

  function dictBar(ep, date, fieldId) {
    if (!dict || dict.epId !== ep.id || dict.date !== date || dict.fieldId !== fieldId) return null;
    return h('div', { class: 'dict-bar', role: 'status' },
      h('span', { class: 'rec-dot' + (dict.paused ? ' paused' : '') }),
      h('span', { class: 'dict-live', id: 'dict-live' }, dict.live || 'Đang nghe…'),
      h('button', {
        class: 'btn sm', type: 'button',
        onClick: function () { if (dict.paused) dict.ctrl.resume(); else dict.ctrl.pause(); dict.paused = !dict.paused; M3.app.render(); },
      }, ui.icon(dict.paused ? 'play' : 'pause'), dict.paused ? 'Tiếp tục' : 'Tạm dừng'),
      h('button', { class: 'btn sm primary', type: 'button', onClick: function () { dict.ctrl.stop(); } }, ui.icon('stop'), 'Dừng'));
  }

  // ---------- truy nguồn khi bôi đen (F3-075) ----------
  function onSelect(ep, f, fieldId, ta) {
    const box = document.getElementById('selsrc-' + fieldId);
    if (!box) return;
    const s = ta.value.slice(ta.selectionStart, ta.selectionEnd).trim();
    box.replaceChildren();
    if (s.length < 4) return;
    const found = D.findProvenance(f.provenance, s);
    if (!found.length) {
      box.append(ui.icon('info'), h('span', null, 'Đoạn đang chọn không có nguồn — nội dung nhập tay hoặc chưa ghi nguồn.'));
    } else {
      box.append(h('span', { class: 'strong' }, 'Nguồn của đoạn đang chọn:'));
      ui.provChips(ep, found).forEach(function (c) { box.append(c); });
    }
  }

  function diffView(prev, f, d) {
    if (!prev) return h('div', { class: 'view-box empty' }, 'Chưa có tờ trước để so sánh.');
    const lines = D.diffLines(prev.fields[d.id].text, f.text);
    return h('div', { class: 'view-box', 'aria-label': 'So sánh ' + d.label + ' với tờ ' + ui.fmtShort(prev.date) },
      lines.length ? lines.map(function (l) { return h('div', { class: 'diff-line ' + l.type }, l.text); }) : h('div', { class: 'muted small' }, 'Cả hai tờ đều trống.'));
  }

  function provView(ep, f) {
    const ss = D.sentences(f.text);
    if (!ss.length) return h('div', { class: 'view-box empty' }, 'Chưa có nội dung.');
    return h('div', { class: 'view-box' }, ss.map(function (s) {
      const found = D.findProvenance(f.provenance, s);
      return h('div', { class: 'prov-line' + (found.length ? '' : ' unsourced') }, h('span', null, s),
        found.length ? h('span', { class: 'row', style: { gap: '4px', flexWrap: 'nowrap' } }, ui.provChips(ep, found)) : h('span', { class: 'tag' }, 'Nhập tay / không có nguồn'));
    }));
  }

  function fieldBlock(ep, date, sh, d, ctx, v, locked) {
    const f = sh.fields[d.id];
    const editable = !locked && canEdit(ctx.user, d.id);
    const prev = M3.sel.prevSheet(ep, date);
    const aiOff = ctx.state.toggles.aiDown;
    const tools = [];
    if (editable && v.mode === 'edit') {
      tools.push(h('button', { class: 'btn sm', type: 'button', disabled: aiOff || Boolean(dict), title: aiOff ? 'AI tạm gián đoạn — gõ tay' : 'Đọc chính tả vào ô này', onClick: function () { startDictation(ep, date, d.id); } }, ui.icon('mic'), 'Đọc chính tả'));
      tools.push(h('button', { class: 'btn sm ai', type: 'button', disabled: aiOff, onClick: function () { suggest(ep, date, d.id); } }, ui.icon('sparkle'), 'Gợi ý'));
      if (d.id === 'ylenh') tools.push(h('button', { class: 'btn sm', type: 'button', disabled: !prev, onClick: function () { copyPrevOrders(ep, date); } }, ui.icon('copy'), 'Chép Y lệnh tờ trước'));
    }
    if (d.id === 'ylenh' && D.hasText(f.text)) tools.push(h('button', { class: 'btn sm', type: 'button', onClick: function () { showOrderCheck(ep, date); } }, ui.icon('check'), 'Kiểm tra Y lệnh'));

    let body;
    if (v.mode === 'diff') body = diffView(prev, f, d);
    else if (v.mode === 'sources') body = provView(ep, f);
    else {
      const ta = h('textarea', {
        id: 'f-' + d.id, class: 'sf-input', role: 'textbox', 'aria-label': d.label, 'aria-multiline': 'true',
        readOnly: !editable, placeholder: editable ? PLACEHOLDER[d.id] : '', value: f.text,
        onInput: function (e) { onType(ep.id, date, d.id, e.target.value); },
        onFocus: function () { v.active = d.id; const c = document.getElementById('ai-ctx'); if (c) c.textContent = ctxLine(date, d.id); },
        onMouseup: function (e) { onSelect(ep, f, d.id, e.target); },
        onKeyup: function (e) { onSelect(ep, f, d.id, e.target); },
      });
      body = [ui.autoGrow(ta), h('div', { class: 'selsrc', id: 'selsrc-' + d.id, 'aria-live': 'polite' })];
    }

    const pendingBar = f.aiPending ? h('div', { class: 'ai-bar' }, ui.icon('sparkle'),
      h('span', { class: 'grow' }, 'Bản nháp AI — kiểm tra rồi bấm Duyệt.' + (f.provenance && f.provenance.length ? ' Nguồn:' : '')),
      ui.provChips(ep, f.provenance),
      editable ? h('button', { class: 'btn sm primary', type: 'button', onClick: function () { approve(ep.id, date, d.id); } }, ui.icon('check'), 'Duyệt') : null,
      editable ? h('button', { class: 'btn sm', type: 'button', onClick: function () { discard(ep.id, date, d.id); } }, 'Bỏ nội dung AI') : null) : null;

    let issues = null;
    if (d.id === 'ylenh' && D.hasText(f.text)) {
      const list = D.orderIssues(f.text, drugs());
      if (list.length) {
        issues = h('div', { class: 'issues', role: 'alert' },
          h('div', { class: 'head' }, ui.icon('alert'), 'Kiểm soát Y lệnh'),
          list.map(function (r) {
            const why = (f.ack || {})[r.line];
            return h('div', { class: why ? 'acked' : '' }, h('span', { class: 'mono' }, r.line), ' — ', r.issues.map(function (i) { return i.message; }).join('; '),
              why ? h('div', { class: 'tiny' }, 'Bác sĩ giữ nguyên, lý do: ' + why) : null);
          }),
          h('div', { class: 'tiny' }, 'Ngưỡng demo, không dùng cho lâm sàng.'));
      }
    }

    return h('div', { class: 'sf' + (f.aiPending ? ' pending' : '') },
      h('div', { class: 'sf-head' },
        h('label', { class: 'sf-label', for: 'f-' + d.id }, d.label, d.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null),
        f.aiPending ? h('span', { class: 'tag ai' }, 'Bản nháp AI — chưa duyệt') : null,
        !editable && !locked ? h('span', { class: 'tag', title: 'Vai trò hiện tại không sửa ô này' }, ui.icon('lock'), 'Chỉ xem') : null,
        h('div', { class: 'sf-tools' }, tools)),
      body, dictBar(ep, date, d.id), pendingBar, issues);
  }

  function msgEl(ep, date, m, ctx, locked) {
    if (m.role === 'user') return h('div', { class: 'msg user' }, m.text);
    if (m.pending) return h('div', { class: 'msg ai typing' }, 'Trợ lý đang soạn…');
    const cls = 'msg ai' + (m.kind === 'refusal' ? ' refusal' : m.kind === 'error' ? ' error' : '');
    const body = m.provenance && m.provenance.length
      ? m.text.split('\n').map(function (line) {
        const p = m.provenance.find(function (x) { return x.sentence === line; });
        return h('div', { class: 'msg-line' }, h('span', null, line), p ? ui.srcTag(ep, p.sourceId) : null);
      })
      : h('div', { class: 'pre' }, m.text);
    const actions = [];
    if (m.kind === 'answer' && !locked) {
      D.SHEET_FIELDS.filter(function (d) { return canEdit(ctx.user, d.id); }).forEach(function (d) {
        actions.push(h('button', { class: 'btn sm', type: 'button', onClick: function () { place(ep, date, d.id, m.text, m.provenance); } }, '→ ' + d.label));
      });
    }
    if (m.code === 'NO_DATA') actions.push(h('a', { class: 'btn sm', href: '#/episode/' + ep.id + '/sources' }, ui.icon('upload'), 'Thêm nguồn dữ liệu'));
    return h('div', { class: cls }, m.title ? h('div', { class: 'msg-title' }, m.title) : null, body, actions.length ? h('div', { class: 'msg-actions' }, actions) : null);
  }

  function aiPanel(ep, date, sh, ctx, v, locked) {
    const aiOff = ctx.state.toggles.aiDown;
    const msgs = chats[ep.id] || [];
    const prev = M3.sel.prevSheet(ep, date);
    const sheetEmpty = !D.SHEET_FIELDS.some(function (d) { return D.hasText(sh.fields[d.id].text); });
    const chips = [];
    if (!locked && D.can(ctx.user.role, 'sheet.edit') && prev) chips.push({ label: '✦ Dựng tờ hôm nay từ tờ ' + ui.fmtShort(prev.date), ai: true, run: function () { startInherit(ep, date); } });
    chips.push({ label: 'Tóm tắt 24 giờ qua', ai: true, run: function () { ask(ep, date, 'Tóm tắt 24 giờ qua'); } });
    chips.push({ label: 'Tóm tắt diễn biến 3 ngày', ai: true, run: function () { ask(ep, date, 'Tóm tắt diễn biến 3 ngày'); } });
    chips.push({ label: 'Kiểm tra Y lệnh', ai: false, run: function () { showOrderCheck(ep, date); } });
    if (!locked && canEdit(ctx.user, v.active)) chips.push({ label: '🎙 Đọc chính tả vào ô đang chọn', ai: true, run: function () { startDictation(ep, date, v.active); } });
    const input = h('input', { id: 'ai-input', placeholder: aiOff ? 'AI tạm gián đoạn' : 'Hỏi hoặc ra lệnh cho trợ lý…', 'aria-label': 'Nhập yêu cầu cho trợ lý AI', disabled: aiOff, autocomplete: 'off' });
    const empty = h('div', { class: 'ai-empty' }, h('div', { class: 'strong' }, 'Bắt đầu nhanh'),
      h('ul', null,
        sheetEmpty && prev ? h('li', null, 'Dựng tờ hôm nay từ tờ ' + ui.fmtShort(prev.date) + ': giữ phần còn hiệu lực, cập nhật từ dữ liệu 24 giờ.') : null,
        h('li', null, 'Đọc chính tả vào ô đang chọn, hoặc bấm "Gợi ý" ở từng ô.'),
        h('li', null, 'Hỏi: "Tóm tắt 24 giờ qua", "Tóm tắt diễn biến 3 ngày".'),
        !prev ? h('li', null, 'Chưa có tờ trước: nhập tay hoặc thêm nguồn (tài liệu, ghi âm) ở tab Nguồn dữ liệu.') : null));
    return h('aside', { class: 'ai-panel', 'aria-label': 'Trợ lý AI' },
      h('div', { class: 'ai-head' }, ui.icon('sparkle'), h('span', { class: 'ai-title' }, 'Trợ lý AI MedVita'),
        h('span', { class: 'tag ' + (aiOff ? 'warn' : 'ok'), style: { marginLeft: 'auto' } }, aiOff ? 'Gián đoạn' : 'Sẵn sàng')),
      h('div', { class: 'ai-ctx', id: 'ai-ctx' }, ctxLine(date, v.active)),
      aiOff ? h('div', { class: 'ai-down', role: 'alert' }, ui.icon('alert'),
        h('div', null, M3.ai.DOWN_MSG + ' ',
          h('button', { class: 'btn sm', type: 'button', onClick: function () { if (M3.ai.isDown()) ui.toast('AI vẫn gián đoạn — tiếp tục nhập tay', 'warn'); else M3.app.render(); } }, 'Thử lại'))) : null,
      h('div', { class: 'ai-log', id: 'ai-log', 'aria-live': 'polite' }, msgs.length ? msgs.map(function (m) { return msgEl(ep, date, m, ctx, locked); }) : empty),
      h('div', { class: 'ai-chips' }, chips.map(function (c) {
        return h('button', { type: 'button', class: 'chip', disabled: c.ai && aiOff, onClick: c.run }, c.label);
      })),
      h('form', {
        class: 'ai-form',
        onSubmit: function (e) {
          e.preventDefault();
          const q = input.value.trim();
          if (!q) return;
          input.value = '';
          ask(ep, date, q);
        },
      }, input, h('button', { class: 'icon-btn', type: 'submit', 'aria-label': 'Gửi yêu cầu cho trợ lý', disabled: aiOff }, ui.icon('send'))),
      h('div', { class: 'ai-foot' }, 'AI chỉ soạn bản nháp có nguồn; không chẩn đoán, không kê đơn, không ký thay bác sĩ.'));
  }

  // ---------- xác nhận, sửa tiếp ----------
  function startConfirm(ep, date) {
    const sh = ep.sheets[date];
    const blockers = D.blockersForConfirm(D.SHEET_FIELDS, sh.fields).concat(orderBlockers(sh));
    if (blockers.length) {
      ui.modal({
        title: 'Chưa xác nhận được tờ điều trị', icon: 'alert', subtitle: 'Xử lý ' + blockers.length + ' mục sau rồi xác nhận lại.',
        body: function (m) {
          return h('div', { class: 'list' }, blockers.map(function (b) {
            return h('div', { class: 'list-item' }, ui.icon(b.reason === 'ai_pending' ? 'sparkle' : 'alert'), h('div', { class: 'grow' }, b.message),
              h('button', {
                class: 'btn sm', type: 'button',
                onClick: function () {
                  m.close();
                  viewOf(ep.id, date).mode = 'edit';
                  M3.app.render();
                  const el = document.getElementById('f-' + b.fieldId);
                  if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
                },
              }, 'Đi tới'));
          }));
        },
        actions: [{ label: 'Đóng', onClick: function (m) { m.close(); } }],
      });
      return;
    }
    ui.modal({
      title: 'Xác nhận tờ điều trị ' + ui.fmtDate(date) + '?', icon: 'check', size: 'lg',
      body: h('div', { class: 'stack' },
        D.SHEET_FIELDS.map(function (d) { return h('div', null, h('div', { class: 'label' }, d.label), h('div', { class: 'pre confirm-box' }, sh.fields[d.id].text || '—')); }),
        h('div', { class: 'banner info' }, ui.icon('lock'), h('div', null, 'Sau khi xác nhận, nội dung khóa; sửa tiếp sẽ tạo phiên bản mới. Theo D-02 hướng 1, chữ ký thực hiện trên HIS / EMR sau khi tờ được xuất hoặc gửi sang.'))),
      actions: [
        { label: 'Quay lại sửa', onClick: function (m) { m.close(); } },
        {
          label: 'Xác nhận', kind: 'primary', icon: 'check', id: 'btn-confirm-ok',
          onClick: function (m) {
            m.close();
            mutate(ep.id, date, function (e, s) {
              D.transition(s, 'confirmed');
              s.confirmedBy = me().id;
              s.confirmedAt = M3.now();
              M3.log(e, 'Xác nhận tờ điều trị', 'Tờ ' + ui.fmtShort(date));
            });
            ui.toast('Đã xác nhận tờ ' + ui.fmtShort(date) + ' — chọn cách xuất sang HIS / EMR');
            M3.exportDialog.sheet(ep.id, date);
          },
        },
      ],
    });
  }

  function reopen(epId, date) {
    ui.confirm({ title: 'Sửa tiếp tờ đã xác nhận?', message: 'Phiên bản hiện tại được lưu ở tab Lịch sử. Tờ chuyển về Bản nháp; cần xác nhận và xuất lại sau khi sửa.', okLabel: 'Sửa tiếp' })
      .then(function (ok) {
        if (!ok) return;
        try {
          mutate(epId, date, function (e, s) {
            const v = D.reopen(s, { by: me().id, at: M3.now() });
            s.confirmedBy = null;
            s.confirmedAt = null;
            M3.log(e, 'Mở lại tờ để sửa (phiên bản ' + v + ')', 'Tờ ' + ui.fmtShort(date));
          });
        } catch (err) {
          ui.toast(err.message, 'error');
        }
      });
  }

  // ---------- tab ----------
  M3.tabs.sheet = {
    render: function (ep, params, ctx) {
      const today = ctx.state.today;
      const date = params.date || today;
      const user = ctx.user;
      const stored = ep.sheets[date];
      const sh = stored || M3.data.emptySheet(date, M3.now().slice(11, 16));
      const v = viewOf(ep.id, date);
      const locked = D.isLocked(sh.status);
      const prev = M3.sel.prevSheet(ep, date);
      const canConfirm = D.can(user.role, 'sheet.confirm');
      const canAnyEdit = D.SHEET_FIELDS.some(function (d) { return canEdit(user, d.id); });
      if (v.mode === 'diff' && !prev) v.mode = 'edit';

      const dates = M3.sel.sheetDates(ep);
      if (dates.indexOf(today) === -1 && today >= ep.admitted) dates.push(today);
      dates.sort().reverse();
      const strip = h('nav', { class: 'date-strip', 'aria-label': 'Chọn ngày' }, dates.map(function (d) {
        const st = ep.sheets[d] ? ep.sheets[d].status : 'empty';
        return h('a', { class: 'date-chip' + (d === date ? ' on' : ''), href: '#/episode/' + ep.id + '/sheet/' + d, 'aria-current': d === date ? 'date' : null },

      if (locked && sh.confirmedAt) {
        banners.push(h('div', { class: 'banner info' }, ui.icon('lock'),
          h('div', { class: 'grow' }, 'Đã xác nhận lúc ' + ui.fmtDT(sh.confirmedAt) + ' bởi ' + ui.userName(sh.confirmedBy) + ' — nội dung chỉ đọc. Sửa tiếp sẽ tạo phiên bản mới.')));

      if (sb) banners.push(sb);

      const timeInput = h('input', {
        type: 'time', class: 'input', id: 'f-time', value: sh.time, 'aria-label': 'Giờ ghi', readOnly: locked || !canAnyEdit, style: { width: '112px' },
        onChange: function (e) { mutate(ep.id, date, function (x, s) { s.time = e.target.value; s.savedAt = M3.now(); }); },

      const head = h('div', { class: 'sheet-head' },

          return h('button', { type: 'button', class: v.mode === x[0] ? 'on' : '', 'aria-pressed': String(v.mode === x[0]), disabled: x[0] === 'diff' && !prev, onClick: function () { v.mode = x[0]; M3.app.render(); } }, x[1]);
        })),
        h('div', { class: 'grow' }),
        !locked && D.can(user.role, 'sheet.edit') && prev
          ? h('button', { class: 'btn ai', type: 'button', id: 'btn-inherit', disabled: ctx.state.toggles.aiDown, onClick: function () { startInherit(ep, date); } }, ui.icon('sparkle'), 'Dựng từ tờ ' + ui.fmtShort(prev.date))
          : null);

      const blockers = stored && !locked ? D.blockersForConfirm(D.SHEET_FIELDS, sh.fields).concat(orderBlockers(sh)) : [];
      const foot = h('div', { class: 'sheet-foot' },
        h('span', { class: 'small muted grow', id: 'save-note' }, sh.savedAt ? 'Đã lưu nháp ' + ui.fmtTime(sh.savedAt) + ' · tự lưu khi gõ' : 'Chưa có nội dung'),
        blockers.length ? h('span', { class: 'tag warn' }, 'Còn ' + blockers.length + ' mục cần xử lý') : null,
        !locked && canConfirm ? h('button', { class: 'btn primary', type: 'button', id: 'btn-confirm', disabled: !stored || sh.status === 'empty', onClick: function () { startConfirm(ep, date); } }, ui.icon('check'), 'Xác nhận tờ điều trị') : null,
        !locked && !canConfirm ? h('span', { class: 'small muted' }, 'Bác sĩ điều trị xác nhận tờ') : null,
        locked && D.can(user.role, 'sheet.export') && sh.status !== 'sending' ? h('button', { class: 'btn primary', type: 'button', id: 'btn-export', onClick: function () { M3.exportDialog.sheet(ep.id, date); } }, ui.icon('download'), 'Xuất…') : null,
        locked && D.can(user.role, 'sheet.edit') && D.canTransition(sh.status, 'draft') ? h('button', { class: 'btn', type: 'button', onClick: function () { reopen(ep.id, date); } }, ui.icon('edit'), 'Sửa tiếp (tạo phiên bản mới)') : null);

      return h('div', null, strip,
        h('div', { class: 'sheet-wrap' },
          h('div', { class: 'stack' }, banners,
            h('section', { class: 'sheet-card', 'aria-label': 'Tờ điều trị ' + ui.fmtDate(date) }, head,
              h('div', { class: 'sheet-body' }, D.SHEET_FIELDS.map(function (d) { return fieldBlock(ep, date, sh, d, ctx, v, locked); })),
              foot),
            h('div', { class: 'tiny muted' }, 'Cấu trúc 3 ô theo bản đang dùng; cấu trúc theo mẫu MS 36/BV2 (TT 32/2023/TT-BYT) chờ chốt — D-20.')),

<script>/* js/screens/export.js */
/* Xuất hồ sơ (F3-055 → F3-060): chép từng trường, bản in / PDF, JSON; gửi HIS khi có tích hợp. */
(function (M3) {
  'use strict';

  const D = M3.domain;
  const ui = M3.ui;
  const h = ui.h;

  ui.style('export', `
.exp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.exp-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.exp-card h3 { font-size: 14px; display: flex; gap: 8px; align-items: center; }
.exp-card h3 .ico { color: var(--brand); }
.exp-card.off { background: var(--soft); }
.exp-card.off h3 .ico { color: var(--muted); }
.exp-fields { display: flex; flex-direction: column; gap: 6px; }
.exp-field { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 12.5px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.exp-field span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 760px) { .exp-grid { grid-template-columns: 1fr; } }
`);

  function docOf(ep, ref) {
    if (ref.kind === 'sheet') return ep.sheets[ref.key];
    if (ref.kind === 'record') return ep.record;
    return ep.discharge[ref.kind];
  }

  function refLabel(ref) {
    if (ref.kind === 'sheet') return 'Tờ điều trị ' + ui.fmtShort(ref.key);
    if (ref.kind === 'record') return 'Bệnh án';
    return ref.kind === 'summary' ? 'Tổng kết bệnh án' : 'Giấy ra viện';
  }

  function markExported(ref, how) {
    M3.store.update(function () {
      const ep = M3.sel.episode(ref.epId);
      const doc = docOf(ep, ref);
      if (doc.status === 'confirmed' || doc.status === 'exported') {
        doc.status = 'exported';
        doc.exportedAt = M3.now();
      }
      M3.log(ep, 'Xuất ' + how, refLabel(ref));
    });
  }

  function sendHis(ref) {
    try {
      M3.store.update(function () {
        const ep = M3.sel.episode(ref.epId);
        const doc = docOf(ep, ref);
        D.transition(doc, 'sending');
        doc.hisError = null;
        M3.log(ep, 'Gửi sang HIS / EMR', refLabel(ref));
      });
    } catch (e) {
      ui.toast(e.message, 'error');
      return;
    }
    setTimeout(function () {
      let failed = false;
      M3.store.update(function (s) {
        const ep = M3.sel.episode(ref.epId);
        const doc = docOf(ep, ref);
        if (!doc || doc.status !== 'sending') return;
        if (s.toggles.hisFailNext || !s.toggles.his) {
          failed = true;
          s.toggles.hisFailNext = false;
          D.transition(doc, 'send_failed');
          doc.hisError = s.toggles.his ? 'HIS không phản hồi sau 30 giây (mô phỏng). Hồ sơ vẫn còn nguyên trong MedVita.' : 'Kết nối HIS đã tắt.';
          M3.log(ep, 'Gửi HIS lỗi', refLabel(ref));
        } else {
          D.transition(doc, 'awaiting_sign');
          doc.hisSentAt = M3.now();
          s.integrations.his.lastSync = doc.hisSentAt;
          M3.log(ep, 'HIS đã nhận — chờ bác sĩ ký trên HIS / EMR', refLabel(ref));
        }
      });
      ui.toast(failed ? 'Gửi HIS lỗi — bấm "Gửi lại HIS"' : 'HIS đã nhận ' + refLabel(ref) + ' — chờ ký trên HIS / EMR', failed ? 'error' : null);
    }, 1400);
  }

  function printDoc(o) {
    const state = M3.store.get();
    const root = document.getElementById('print-root');
    const body = o.table
      ? h('table', null,
        h('thead', null, h('tr', null, o.table.head.map(function (x) { return h('th', null, x); }))),
        h('tbody', null, o.table.rows.map(function (r) { return h('tr', null, r.map(function (c) { return h('td', null, c); })); })))
      : h('table', null, h('tbody', null, o.rows.map(function (r) {
        return h('tr', null, h('th', { style: { width: '32%' } }, r[0]), h('td', null, r[1]));
      })));
    root.replaceChildren(h('div', null,
      h('div', { class: 'p-head' }, h('div', null, state.hospital.name, h('br'), 'Khoa ' + o.dept), h('div', null, 'Mã BN: ' + o.code)),
      h('h1', null, o.title),
      h('div', { class: 'p-meta' }, o.meta.map(function (m) { return h('div', null, m); })),
      body,
      h('div', { class: 'p-sign' }, 'Bác sĩ điều trị (ký trên HIS / EMR)'),
      h('div', { class: 'p-sign', style: { fontSize: '9pt' } }, 'Bản in từ MedVita — bản làm việc. Hồ sơ chính thức và chữ ký ở HIS / EMR.')));
    window.print();
  }

  function open(o) {
    const st = M3.store.get();
    ui.modal({
      title: o.title, subtitle: o.subtitle, icon: 'download', size: 'lg',
      body: function (m) {
        const fieldsCard = h('div', { class: 'exp-card' },
          h('h3', null, ui.icon('copy'), 'Chép từng trường'),
          h('div', { class: 'hint' }, 'Dán vào đúng ô trên HIS / EMR khi bệnh viện chưa có tích hợp.'),
          h('div', { class: 'exp-fields' }, o.fields.map(function (f) {
            return h('div', { class: 'exp-field' }, h('span', null, f.label + ': ' + (f.text || '—').replace(/\n/g, ' · ')),
              h('button', {
                class: 'btn sm', type: 'button', disabled: !D.hasText(f.text),
                onClick: function () {
                  ui.copyText(f.text).then(function () { ui.toast('Đã chép "' + f.label + '"'); markExported(o.ref, '(chép trường ' + f.label + ')'); });
                },
              }, ui.icon('copy'), 'Chép'));
          })));
        const printCard = h('div', { class: 'exp-card' },
          h('h3', null, ui.icon('printer'), 'In / lưu PDF'),
          h('div', { class: 'hint' }, 'Bản in theo bố cục biểu mẫu, ghi rõ "ký trên HIS / EMR".'),
          h('div', null, h('button', { class: 'btn', type: 'button', onClick: function () { printDoc(o.print); markExported(o.ref, 'bản in / PDF'); } }, ui.icon('printer'), 'Mở bản in')));
        const jsonCard = h('div', { class: 'exp-card' },
          h('h3', null, ui.icon('download'), 'Tải file JSON'),
          h('div', { class: 'hint' }, 'Dữ liệu có cấu trúc để nhập vào HIS / EMR hoặc lưu trữ.'),
          h('div', null, h('button', {
            class: 'btn', type: 'button',
            onClick: function () { ui.download(o.json.filename, JSON.stringify(o.json.data, null, 2)); markExported(o.ref, 'file JSON'); ui.toast('Đã tải ' + o.json.filename); },
          }, ui.icon('download'), 'Tải ' + o.json.filename)));
        const hisCard = st.toggles.his
          ? h('div', { class: 'exp-card' },
            h('h3', null, ui.icon('send'), 'Gửi sang HIS / EMR'),
            h('div', { class: 'hint' }, 'Tích hợp đã bật (' + (st.integrations.his.method === 'fhir' ? 'FHIR' : st.integrations.his.method === 'hl7' ? 'HL7 v2' : 'API') + '). Sau khi HIS nhận, bác sĩ ký trên HIS / EMR.'),
            h('div', null, h('button', { class: 'btn primary', type: 'button', onClick: function () { m.close(); sendHis(o.ref); } }, ui.icon('send'), 'Gửi sang HIS')))
          : h('div', { class: 'exp-card off' },
            h('h3', null, ui.icon('send'), 'Gửi sang HIS / EMR'),
            h('span', { class: 'tag opt' }, 'Tích hợp tùy chọn'),
            h('div', { class: 'hint' }, 'Bệnh viện chưa bật tích hợp HIS. Dùng 3 cách bên cạnh; khi có tích hợp, nút gửi sẽ hiện ở đây.'));
        return h('div', { class: 'stack' },
          h('div', { class: 'banner info' }, ui.icon('info'), h('div', null, 'D-02 hướng 1: MedVita là nơi làm việc. Hồ sơ chính thức và chữ ký ở HIS / EMR — xuất hoặc gửi sang rồi bác sĩ ký ở đó.')),
          h('div', { class: 'exp-grid' }, fieldsCard, printCard, jsonCard, hisCard));
      },
      actions: [{ label: 'Đóng', onClick: function (m) { m.close(); } }],
    });
  }

  function sheetExport(epId, date) {
    const ep = M3.sel.episode(epId);
    const p = M3.sel.patientOf(ep);
    const sh = ep.sheets[date];
    const dept = M3.sel.dept(ep.dept).name;
    const care = sh.fields.chamsoc.text;
    open({
      ref: { epId: epId, kind: 'sheet', key: date },
      title: 'Xuất tờ điều trị ' + ui.fmtDate(date),
      subtitle: p.name + ' · giường ' + ep.bed + ' · phiên bản ' + (sh.version || 1),
      fields: D.SHEET_FIELDS.map(function (d) { return { label: d.label, text: sh.fields[d.id].text }; }),
      json: { filename: 'to-dieu-tri-' + p.code + '-' + date + '.json', data: D.sheetExport(p, ep, sh) },
      print: {
        title: 'TỜ ĐIỀU TRỊ', dept: dept, code: p.code,
        meta: ['Họ tên người bệnh: ' + p.name + ' · ' + M3.sel.age(p) + ' tuổi · ' + p.sex, 'Buồng / giường: ' + ep.bed + ' · Chẩn đoán: ' + ep.diagnosis],
        table: {
          head: ['Ngày giờ', 'Diễn biến bệnh', 'Y lệnh'],
          rows: [[ui.fmtDate(date) + '\n' + sh.time, sh.fields.dienbien.text, sh.fields.ylenh.text + (D.hasText(care) ? '\n\nChăm sóc: ' + care : '')]],
        },
      },
    });
  }

  function docExport(epId, kind) {
    const ep = M3.sel.episode(epId);
    const p = M3.sel.patientOf(ep);
    const tpl = kind === 'record' ? M3.sel.template(ep.templateId) : M3.data.DISCHARGE[kind];
    const doc = kind === 'record' ? ep.record : ep.discharge[kind];
    const rows = [];
    tpl.sections.forEach(function (s) {
      s.fields.forEach(function (f) { rows.push([(tpl.sections.length > 1 ? s.title + ' › ' : '') + f.label, (doc.fields[f.id] || {}).text || '']); });
    });
    open({
      ref: { epId: epId, kind: kind, key: null },
      title: 'Xuất ' + tpl.title.toLowerCase(),
      subtitle: p.name + ' · phiên bản ' + (doc.version || 1),
      fields: rows.map(function (r) { return { label: r[0], text: r[1] }; }),
      json: { filename: kind + '-' + p.code + '.json', data: D.docExport(p, ep, kind, tpl, doc) },
      print: {
        title: tpl.title.toUpperCase(), dept: M3.sel.dept(ep.dept).name, code: p.code,
        meta: ['Họ tên người bệnh: ' + p.name + ' · ' + M3.sel.age(p) + ' tuổi · ' + p.sex, 'Vào viện: ' + ui.fmtDate(ep.admitted) + ' · Buồng / giường: ' + ep.bed],
        rows: rows,
      },
    });
  }

  // Banner trạng thái xuất / gửi HIS dùng chung cho tờ điều trị, bệnh án, hồ sơ ra viện.
  function statusBanner(ref, doc) {
    if (doc.status === 'sending') {
      return h('div', { class: 'banner blue', role: 'status' }, ui.icon('send'), h('div', { class: 'grow' }, 'Đang gửi sang HIS / EMR…'));
    }
    if (doc.status === 'awaiting_sign') {
      return h('div', { class: 'banner violet' }, ui.icon('clock'),
        h('div', { class: 'grow' }, 'HIS đã nhận lúc ' + ui.fmtDT(doc.hisSentAt) + '. Chờ bác sĩ ký trên HIS / EMR — MedVita không ký thay (D-02 hướng 1).'));
    }
    if (doc.status === 'send_failed') {
      return h('div', { class: 'banner error', role: 'alert' }, ui.icon('alert'),
        h('div', { class: 'grow' }, h('strong', null, 'Gửi HIS lỗi. '), doc.hisError || ''),
        h('button', { class: 'btn sm', type: 'button', onClick: function () { sendHis(ref); } }, ui.icon('refresh'), 'Gửi lại HIS'));
    }
    if (doc.status === 'exported') {
      return h('div', { class: 'banner info' }, ui.icon('check'),
        h('div', { class: 'grow' }, 'Đã xuất' + (doc.exportedAt ? ' lúc ' + ui.fmtDT(doc.exportedAt) : '') + ' để đưa vào HIS / EMR. Bác sĩ ký trên HIS / EMR.'));
    }
    return null;
  }

  M3.exportDialog = { open: open, sheet: sheetExport, doc: docExport, sendHis: sendHis, printDoc: printDoc, docOf: docOf, refLabel: refLabel, statusBanner: statusBanner };
})(window.M3 = window.M3 || {});

<script>/* js/screens/record.js */
/* Hồ sơ theo mẫu (bệnh án, tổng kết bệnh án, giấy ra viện): AI soạn nháp có nguồn, kiểm tra chất lượng,
   xác nhận từng phần và xác nhận cuối. F3-010, F3-013, F3-014, F3-019, F3-049 → F3-054, F3-069, F3-084. */
(function (M3) {
  'use strict';

  const D = M3.domain;
  const ui = M3.ui;
  const h = ui.h;

  ui.style('record', `

.rf { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rf.wide { grid-column: 1 / -1; }
.rf-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rf-head label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.rf.pending .input, .rf.pending .textarea, .rf.pending .select { border-color: var(--amber-strong); background: #FFFCF4; border-left-width: 4px; }
.rf-ai { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.check-panel { border: 1px solid var(--amber-line); background: var(--amber-bg); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5F4100; }
.check-panel .list-item { padding: 6px 0; border-color: #F3E2BA; }
.skip-panel { border: 1px dashed var(--line-2); background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 12.5px; color: var(--ink-2); }
.skip-panel ul { margin: 6px 0 0; padding-left: 18px; }
.icd-row { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
@media (max-width: 900px) { .sec-body { grid-template-columns: 1fr; } }
`);

  const checks = {};
  const skipped = {};
  const busy = {};

  const PERMS = {
    record: { edit: 'record.edit', section: 'record.confirmSection', final: 'record.confirmFinal' },
    summary: { edit: 'discharge.edit', section: null, final: 'discharge.confirm' },
    paper: { edit: 'discharge.edit', section: null, final: 'discharge.confirm' },
  };

  function tplOf(ep, kind) { return kind === 'record' ? M3.sel.template(ep.templateId) : M3.data.DISCHARGE[kind]; }
  function docOf(ep, kind) { return kind === 'record' ? ep.record : ep.discharge[kind]; }
  function docLabel(kind) { return kind === 'record' ? 'Bệnh án' : kind === 'summary' ? 'Tổng kết bệnh án' : 'Giấy ra viện'; }
  function me() { return M3.sel.currentUser(); }
  function key(ep, kind) { return ep.id + '|' + kind; }
  function fieldOf(doc, id) { return doc.fields[id] || (doc.fields[id] = M3.data.field('')); }
  function doctorOnly(f) { return f.aiAllowed === false || f.aiAllowed === 'suggest'; }

  function canEditField(user, kind, f) {
    if (!D.can(user.role, PERMS[kind].edit)) return false;
    if (doctorOnly(f) && user.role === 'nurse') return false;
    return true;
  }

  function mutate(epId, kind, fn, opts) {
    M3.store.update(function () {
      const ep = M3.sel.episode(epId);
      fn(ep, docOf(ep, kind));
    }, opts);
  }

  function onType(epId, kind, sectionId, fieldId, value) {
    let changed = false;
    mutate(epId, kind, function (ep, doc) {
      fieldOf(doc, fieldId).text = value;
      doc.savedAt = M3.now();
      if (doc.sectionConfirm && doc.sectionConfirm[sectionId]) {
        delete doc.sectionConfirm[sectionId];
        changed = true;
        M3.log(ep, 'Bỏ xác nhận phần do sửa nội dung', docLabel(kind) + ' › ' + sectionId);
      }
    }, { silent: true });
    M3.app.debounce('rec-type', function () { M3.app.render(); }, changed ? 50 : 900);
  }

  function setAiState(epId, kind, fieldIds, approveIt) {
    mutate(epId, kind, function (ep, doc) {
      fieldIds.forEach(function (id) {
        const f = fieldOf(doc, id);
        if (!f.aiPending) return;
        if (!approveIt) { f.text = f.prevText || ''; f.provenance = []; f.aiFilled = false; }
        f.aiPending = false;
        delete f.prevText;
      });
      M3.log(ep, approveIt ? 'Duyệt nội dung AI (' + fieldIds.length + ' trường)' : 'Bỏ nội dung AI', docLabel(kind));
    });
  }

  async function draft(ep, kind, sectionId) {
    const k = key(ep, kind);
    const tpl = tplOf(ep, kind);
    busy[k] = sectionId ? 'AI đang soạn mục ' + tpl.sections.find(function (s) { return s.id === sectionId; }).title + '…' : 'AI đang soạn các trường còn trống…';
    M3.app.render();
    let r;
    try {
      r = await M3.ai.draftFields(ep, tpl, docOf(ep, kind), { kind: kind, sectionId: sectionId });
    } catch (e) {
      delete busy[k];
      ui.toast(e.message, e.code === 'AI_DOWN' ? 'error' : 'warn');
      M3.app.render();
      return;
    }
    delete busy[k];
    skipped[k] = r.skipped;
    mutate(ep.id, kind, function (e, doc) {
      r.filled.forEach(function (x) {
        const f = fieldOf(doc, x.fieldId);
        f.prevText = f.text;
        f.text = x.text;
        f.provenance = x.provenance;
        f.aiPending = true;
        f.aiFilled = true;
      });
      tpl.sections.forEach(function (s) {
        if (s.fields.some(function (f) { return r.filled.some(function (x) { return x.fieldId === f.id; }); })) delete doc.sectionConfirm[s.id];
      });
      doc.savedAt = M3.now();
      M3.log(e, 'AI soạn nháp ' + r.filled.length + ' trường (chờ duyệt)', docLabel(kind));
    });
    ui.toast('AI đã soạn ' + r.filled.length + ' trường' + (r.skipped.length ? ' · để trống ' + r.skipped.length + ' trường' : ''));
  }

  async function selfCheck(ep, kind) {
    const k = key(ep, kind);
    busy[k] = 'AI đang tự kiểm bản nháp so với nguồn…';
    M3.app.render();
    try {
      checks[k] = await M3.ai.selfCheck(ep, tplOf(ep, kind), docOf(ep, kind), kind);
      ui.toast(checks[k].length ? 'Tự kiểm: ' + checks[k].length + ' điểm cần xem' : 'Tự kiểm: không thấy vấn đề');
    } catch (e) {
      ui.toast(e.message, 'error');
    }
    delete busy[k];
    M3.app.render();
  }

  async function suggestIcd(ep, kind, field) {
    const doc = docOf(ep, kind);
    const dx = (doc.fields.chan_doan || {}).text || '';
    if (!D.hasText(dx)) { ui.toast('Nhập chẩn đoán trước — AI chỉ gợi ý mã từ chẩn đoán bác sĩ đã ghi.', 'warn'); return; }
    let list;
    try { list = await M3.ai.suggestIcd(dx); } catch (e) { ui.toast(e.message, 'error'); return; }
    const picked = {};
    ui.modal({
      title: 'Gợi ý mã ICD-10', icon: 'sparkle',
      subtitle: 'Từ chẩn đoán: "' + dx + '" — danh mục ICD-10 (bản demo). Bác sĩ kiểm tra trước khi dùng.',
      body: list.length
        ? h('div', { class: 'stack' }, list.map(function (x, i) {
          picked[x.code] = i === 0;
          return h('label', { class: 'icd-row' },
            h('input', { type: 'checkbox', checked: i === 0, onChange: function (e) { picked[x.code] = e.target.checked; } }),
            h('div', { class: 'grow' }, h('div', null, h('span', { class: 'mono strong' }, x.code), ' — ', x.label),
              h('div', { class: 'small muted' }, 'Căn cứ: "' + x.basis + '" trong chẩn đoán')));
        }))
        : h('div', { class: 'empty' }, 'Không tìm thấy mã phù hợp trong danh mục demo — bác sĩ nhập tay.'),
      note: 'Gợi ý mã kèm căn cứ (F3-069). Mã dùng cho BHYT cần theo danh mục hiện hành.',
      actions: [
        { label: 'Hủy', onClick: function (m) { m.close(); } },
        {
          label: 'Điền mã đã chọn', kind: 'primary', disabled: !list.length,
          onClick: function (m) {
            const codes = list.filter(function (x) { return picked[x.code]; });
            if (!codes.length) return;
            m.close();
            mutate(ep.id, kind, function (e, d) {
              const f = fieldOf(d, field.id);
              f.prevText = f.text;
              f.text = codes.map(function (x) { return x.code; }).join('; ');
              f.provenance = [{ sentence: f.text, sourceId: null }];
              f.aiPending = true;
              f.aiFilled = false;
              M3.log(e, 'Gợi ý mã ICD-10 (chờ duyệt)', f.text);
            });
          },
        },
      ],
    });
  }

  function goTo(fieldId, sectionId) {
    const el = (fieldId && document.getElementById('rf-' + fieldId)) || document.getElementById('sec-' + sectionId);
    if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus(); }
  }

  function blockersModal(title, blockers) {
    ui.modal({
      title: title, icon: 'alert', subtitle: 'Xử lý ' + blockers.length + ' mục sau rồi xác nhận lại.',
      body: function (m) {
        return h('div', { class: 'list' }, blockers.map(function (b) {
          return h('div', { class: 'list-item' }, ui.icon(b.reason === 'ai_pending' ? 'sparkle' : 'alert'), h('div', { class: 'grow' }, b.message),
            h('button', { class: 'btn sm', type: 'button', onClick: function () { m.close(); goTo(b.fieldId, b.sectionId); } }, 'Đi tới'));
        }));
      },
      actions: [{ label: 'Đóng', onClick: function (m) { m.close(); } }],
    });
  }

  function confirmSection(ep, kind, section) {
    const doc = docOf(ep, kind);
    const blockers = D.sectionBlockers(section, doc);
    if (blockers.length) { blockersModal('Chưa xác nhận được phần ' + section.title, blockers); return; }
    mutate(ep.id, kind, function (e, d) {
      d.sectionConfirm[section.id] = { by: me().id, at: M3.now() };
      M3.log(e, 'Xác nhận phần', docLabel(kind) + ' › ' + section.title);
    });
    ui.toast('Đã xác nhận phần ' + section.title);
  }

  function confirmFinal(ep, kind) {
    const tpl = tplOf(ep, kind);
    const doc = docOf(ep, kind);
    const blockers = D.recordBlockers(tpl, doc, { requireSections: kind === 'record' });
    if (blockers.length) { blockersModal('Chưa xác nhận cuối được ' + docLabel(kind).toLowerCase(), blockers); return; }
    ui.modal({
      title: 'Xác nhận cuối ' + docLabel(kind).toLowerCase() + '?', icon: 'check',
      body: h('div', { class: 'stack' },
        h('p', null, 'Mọi trường bắt buộc đã có nội dung, nội dung AI đã được duyệt' + (kind === 'record' ? ', các phần đã được xác nhận.' : '.')),
        h('div', { class: 'banner info' }, ui.icon('lock'), h('div', null, 'Sau khi xác nhận, nội dung khóa; sửa tiếp tạo phiên bản mới. Theo D-02 hướng 1, bác sĩ ký trên HIS / EMR sau khi hồ sơ được xuất hoặc gửi sang.'))),
      actions: [
        { label: 'Quay lại', onClick: function (m) { m.close(); } },
        {
          label: 'Xác nhận cuối', kind: 'primary', icon: 'check', id: 'btn-final-ok',
          onClick: function (m) {
            m.close();
            mutate(ep.id, kind, function (e, d) {
              D.transition(d, 'confirmed');
              d.finalConfirm = { by: me().id, at: M3.now() };
              d.confirmedBy = me().id;
              d.confirmedAt = d.finalConfirm.at;
              M3.log(e, 'Xác nhận cuối', docLabel(kind));
            });
            ui.toast('Đã xác nhận cuối ' + docLabel(kind).toLowerCase());
            M3.exportDialog.doc(ep.id, kind);
          },
        },
      ],
    });
  }

  function reopen(ep, kind) {
    ui.confirm({ title: 'Sửa tiếp ' + docLabel(kind).toLowerCase() + '?', message: 'Phiên bản hiện tại được lưu ở tab Lịch sử. Hồ sơ về Bản nháp; cần xác nhận cuối và xuất lại.', okLabel: 'Sửa tiếp' })
      .then(function (ok) {
        if (!ok) return;
        try {
          mutate(ep.id, kind, function (e, d) {
            const v = D.reopen(d, { by: me().id, at: M3.now() });
            d.confirmedBy = null;
            d.confirmedAt = null;
            M3.log(e, 'Mở lại để sửa (phiên bản ' + v + ')', docLabel(kind));
          });
        } catch (err) {
          ui.toast(err.message, 'error');
        }
      });
  }

  function control(ep, kind, section, f, value, editable) {
    const id = 'rf-' + f.id;
    const onInput = function (e) { onType(ep.id, kind, section.id, f.id, e.target.value); };
    if (f.type === 'textarea') {
      return ui.autoGrow(h('textarea', { class: 'textarea', id: id, rows: 2, value: value, readOnly: !editable, 'aria-label': f.label, onInput: onInput }));
    }
    if (f.type === 'select') {
      return h('select', { class: 'select', id: id, value: value, disabled: !editable, 'aria-label': f.label, onChange: function (e) { onType(ep.id, kind, section.id, f.id, e.target.value); M3.app.render(); } },
        h('option', { value: '' }, '— Chọn —'), (f.options || []).map(function (o) { return h('option', { value: o }, o); }));
    }
    return h('input', {
      class: 'input', id: id, type: f.type === 'date' ? 'date' : f.type === 'number' ? 'number' : 'text', value: value, readOnly: !editable, 'aria-label': f.label,
      onInput: onInput,
    });
  }

  function fieldEl(ep, kind, doc, section, f, ctx, locked) {
    const v = doc.fields[f.id] || { text: '' };
    const editable = !locked && canEditField(ctx.user, kind, f);
    const aiOff = ctx.state.toggles.aiDown;
    return h('div', { class: 'rf' + (f.type === 'textarea' ? ' wide' : '') + (v.aiPending ? ' pending' : '') },
      h('div', { class: 'rf-head' },
        h('label', { for: 'rf-' + f.id }, f.label, f.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null),
        f.aiAllowed === false ? h('span', { class: 'tag', title: 'AI không điền trường này' }, 'Bác sĩ nhập') : null,
        v.aiPending ? h('span', { class: 'tag ai' }, 'Bản nháp AI — chưa duyệt') : null,
        f.aiAllowed === 'suggest' && editable ? h('button', { class: 'btn sm ai', type: 'button', disabled: aiOff, onClick: function () { suggestIcd(ep, kind, f); } }, ui.icon('sparkle'), 'Gợi ý mã') : null),
      control(ep, kind, section, f, v.text || '', editable),
      (v.aiPending || (v.provenance && v.provenance.some(function (p) { return p.sourceId; }))) ? h('div', { class: 'rf-ai' },
        v.provenance && v.provenance.some(function (p) { return p.sourceId; }) ? [h('span', { class: 'muted' }, 'Nguồn:'), ui.provChips(ep, v.provenance)] : null,
        v.aiPending && editable ? h('button', { class: 'btn sm primary', type: 'button', onClick: function () { setAiState(ep.id, kind, [f.id], true); } }, ui.icon('check'), 'Duyệt') : null,
        v.aiPending && editable ? h('button', { class: 'btn sm', type: 'button', onClick: function () { setAiState(ep.id, kind, [f.id], false); } }, 'Bỏ') : null) : null);
  }

  function sectionEl(ep, kind, doc, tpl, section, ctx, locked) {
    const sc = (doc.sectionConfirm || {})[section.id];
    const req = section.fields.filter(function (f) { return f.required; });
    const reqOk = req.filter(function (f) { return D.hasText((doc.fields[f.id] || {}).text); }).length;
    const pending = section.fields.filter(function (f) { return (doc.fields[f.id] || {}).aiPending; }).map(function (f) { return f.id; });
    const canDraft = !locked && D.can(ctx.user.role, PERMS[kind].edit) && section.fields.some(function (f) { return f.aiAllowed === true && !D.hasText((doc.fields[f.id] || {}).text); });
    const sectionPerm = PERMS[kind].section;
    return h('section', { class: 'card sec', id: 'sec-' + section.id, tabindex: '-1', 'aria-label': section.title },
      h('div', { class: 'card-head' },
        h('h3', null, section.title),
        req.length ? h('span', { class: 'sec-meta' }, reqOk + '/' + req.length + ' bắt buộc') : null,
        h('div', { class: 'sec-actions' },
          canDraft ? h('button', { class: 'btn sm ai', type: 'button', disabled: ctx.state.toggles.aiDown || Boolean(busy[key(ep, kind)]), onClick: function () { draft(ep, kind, section.id); } }, ui.icon('sparkle'), 'AI soạn mục này') : null,
          pending.length > 1 && !locked ? h('button', { class: 'btn sm', type: 'button', onClick: function () { setAiState(ep.id, kind, pending, true); } }, ui.icon('check'), 'Duyệt cả mục') : null,
          sectionPerm ? (sc
            ? h('span', { class: 'tag ok' }, ui.icon('check'), 'Xác nhận · ' + ui.userName(sc.by) + ' · ' + ui.fmtDT(sc.at))
            : !locked && D.can(ctx.user.role, sectionPerm) ? h('button', { class: 'btn sm', type: 'button', onClick: function () { confirmSection(ep, kind, section); } }, ui.icon('check'), 'Xác nhận phần này')
              : h('span', { class: 'tag' }, 'Chưa xác nhận')) : null)),
      h('div', { class: 'sec-body' }, section.fields.map(function (f) { return fieldEl(ep, kind, doc, section, f, ctx, locked); })));
  }

  function render(ep, kind, ctx) {
    const tpl = tplOf(ep, kind);
    const doc = docOf(ep, kind);
    const k = key(ep, kind);
    const locked = D.isLocked(doc.status);
    const comp = D.completeness(tpl, doc.fields);
    const user = ctx.user;
    const aiOff = ctx.state.toggles.aiDown;
    const pendingAll = Object.keys(doc.fields).filter(function (id) { return doc.fields[id].aiPending; });
    const canEdit = D.can(user.role, PERMS[kind].edit);
    const ref = { epId: ep.id, kind: kind, key: null };

    const head = h('section', { class: 'card' },
      h('div', { class: 'fd-head' },
        h('div', null,
          h('div', { class: 'fd-title' }, tpl.title, ' ', h('span', { class: 'tag' }, 'Mẫu v' + tpl.version)),
          h('div', { class: 'small muted' }, kind === 'record'
            ? 'Người được phân công (' + ui.userName(ep.nurseId) + ') kiểm tra, xác nhận từng phần; bác sĩ điều trị xác nhận cuối.'
            : 'AI soạn nháp từ tờ điều trị và nguồn dữ liệu; bác sĩ điều trị xác nhận.')),
        h('div', { class: 'fd-progress' }, ui.progress(comp.pct), h('strong', null, comp.pct + '%'), h('span', { class: 'muted' }, comp.requiredFilled + '/' + comp.required + ' bắt buộc')),
        ui.badge(doc.status),
        h('div', { class: 'fd-actions' },
          !locked && canEdit ? h('button', { class: 'btn ai', type: 'button', id: 'btn-draft-all', disabled: aiOff || Boolean(busy[k]), onClick: function () { draft(ep, kind); } }, ui.icon('sparkle'), 'AI soạn nháp các trường trống') : null,
          !locked && canEdit ? h('button', { class: 'btn', type: 'button', id: 'btn-self-check', disabled: aiOff || Boolean(busy[k]), onClick: function () { selfCheck(ep, kind); } }, ui.icon('search'), 'AI tự kiểm') : null,
          !locked && pendingAll.length ? h('span', { class: 'tag ai' }, pendingAll.length + ' trường AI chờ duyệt') : null,
          !locked && D.can(user.role, PERMS[kind].final) ? h('button', { class: 'btn primary', type: 'button', id: 'btn-final', onClick: function () { confirmFinal(ep, kind); } }, ui.icon('check'), 'Xác nhận cuối') : null,
          locked && D.can(user.role, PERMS[kind].final) && doc.status !== 'sending' ? h('button', { class: 'btn primary', type: 'button', onClick: function () { M3.exportDialog.doc(ep.id, kind); } }, ui.icon('download'), 'Xuất…') : null,
          locked && canEdit && D.canTransition(doc.status, 'draft') ? h('button', { class: 'btn', type: 'button', onClick: function () { reopen(ep, kind); } }, ui.icon('edit'), 'Sửa tiếp') : null)));

    const banners = [];
    if (aiOff) banners.push(h('div', { class: 'banner warn' }, ui.icon('alert'), h('div', null, h('strong', null, 'Chế độ nhập tay. '), 'AI tạm gián đoạn — vẫn nhập, xác nhận và xuất bình thường.')));
    if (busy[k]) banners.push(h('div', { class: 'banner blue', role: 'status' }, ui.icon('clock'), h('div', null, busy[k])));
    if (locked && doc.finalConfirm) banners.push(h('div', { class: 'banner info' }, ui.icon('lock'), h('div', null, 'Đã xác nhận cuối lúc ' + ui.fmtDT(doc.finalConfirm.at) + ' bởi ' + ui.userName(doc.finalConfirm.by) + ' — nội dung chỉ đọc.')));
    const sb = M3.exportDialog.statusBanner(ref, doc);
    if (sb) banners.push(sb);
    if (kind === 'record' && doc.templateVersion && doc.templateVersion !== tpl.version) {
      banners.push(h('div', { class: 'banner info' }, ui.icon('layers'), h('div', null, 'Hồ sơ tạo theo mẫu v' + doc.templateVersion + '; mẫu hiện tại v' + tpl.version + '. Trường mới (nếu có) hiện trong mục tương ứng.')));
    }
    if (skipped[k] && skipped[k].length && !locked) {
      banners.push(h('div', { class: 'skip-panel' }, h('strong', null, 'AI để trống ' + skipped[k].length + ' trường:'),
        h('ul', null, skipped[k].map(function (s) { return h('li', null, s.label + ' — ' + s.reason); }))));
    }
    if (checks[k] && !locked) {
      banners.push(checks[k].length
        ? h('div', { class: 'check-panel', role: 'status' }, h('div', { class: 'row' }, ui.icon('search'), h('strong', null, 'Kết quả AI tự kiểm: ' + checks[k].length + ' điểm cần xem'),
          h('button', { class: 'btn sm', type: 'button', style: { marginLeft: 'auto' }, onClick: function () { delete checks[k]; M3.app.render(); } }, 'Ẩn')),
          h('div', { class: 'list' }, checks[k].map(function (x) {
            return h('div', { class: 'list-item' }, h('div', { class: 'grow' }, h('strong', null, x.label + ': '), x.message),
              h('button', { class: 'btn sm', type: 'button', onClick: function () { goTo(x.fieldId); } }, 'Đi tới'));
          })))
        : h('div', { class: 'banner info' }, ui.icon('check'), h('div', null, 'AI tự kiểm: không thấy câu thiếu nguồn hay trường bắt buộc còn trống.')));
    }

    return h('div', { class: 'stack' }, head, banners, tpl.sections.map(function (s) { return sectionEl(ep, kind, doc, tpl, s, ctx, locked); }));
  }

  M3.formDoc = { render: render };

  M3.tabs.record = {
    render: function (ep, params, ctx) { return render(ep, 'record', ctx); },
  };
})(window.M3 = window.M3 || {});
</script>
<script>/* js/screens/sources.js */
/* Tab Nguồn dữ liệu: mọi nguồn của đợt điều trị, nơi đang dùng, nguồn từng trường (F3-007, F3-008, F3-011, F3-012, F3-018, F3-086). */
(function (M3) {
  'use strict';

  const D = M3.domain;
  const ui = M3.ui;
  const h = ui.h;

  ui.style('sources', `
.src-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.src-item { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid #EDF1F0; }
.src-item:last-child { border-bottom: 0; }
.src-content { font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; }
.src-used { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.fld-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EDF1F0; font-size: 13px; }
.fld-row:last-child { border-bottom: 0; }
@media (max-width: 1100px) { .src-grid { grid-template-columns: 1fr; } }
`);

  const FILTERS = [
    { id: 'all', label: 'Tất cả', test: function () { return true; } },
    { id: 'manual', label: 'Nhập tay', test: function (s) { return s.type === 'manual'; } },

          stat('—', 'Trường AI chờ duyệt', String(pending), 'Không được xác nhận khi còn mục chờ duyệt'),
          stat('—', 'Thao tác có AI hỗ trợ', String(aiActions), 'Từ nhật ký thao tác')),
        h('div', { class: 'banner warn', style: { marginBottom: '16px' } }, ui.icon('info'),
          h('div', null, h('strong', null, 'Số liệu demo. '), 'Thời gian làm hồ sơ, tỷ lệ giữ lại nội dung AI, mức hài lòng dưới đây là số minh họa — chưa có baseline (PL.2) và mức mục tiêu (cần chốt).')),
        h('div', { class: 'rep-grid' },
          h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h3', null, 'KPI-01 · Thời gian hoàn tất tờ điều trị (phút)'), h('span', { class: 'tag' }, 'demo')),

              bar('Trước pilot (baseline)', R.minutesBefore, R.minutesBefore, R.minutesBefore + ' phút', 'before'),

          h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h3', null, 'KPI-02, KPI-03, KPI-12'), h('span', { class: 'tag' }, 'demo')),
            h('div', { class: 'card-body' },
              bar('Nội dung AI giữ lại', R.aiKeptPct, 100, R.aiKeptPct + '%'),

          h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h3', null, 'KPI-04 · Độ đầy đủ bệnh án theo khoa')),

            h('table', { class: 'table', style: { border: 0 } },
              h('thead', null, h('tr', null, ['Bác sĩ', 'Số tờ', 'Phút trước → sau', 'Sửa / 100'].map(function (t) { return h('th', { scope: 'col' }, t); }))),
              h('tbody', null, R.byDoctor.map(function (d) {
                return h('tr', null, h('td', null, h('div', { class: 'strong' }, d.name), h('div', { class: 'tiny muted' }, d.dept)), h('td', null, String(d.sheets)), h('td', null, d.minBefore + ' → ' + d.minAfter), h('td', null, String(d.editsPer100)));

<script>/* js/screens/mobile.js */
/* Màn đi buồng (mobile): ghi âm nhiều lần trong ngày, gộp vào tờ điều trị dưới dạng bản nháp AI; hàng chờ khi mất mạng (F3-076). */
(function (M3) {
  'use strict';

  const D = M3.domain;
  const ui = M3.ui;
  const h = ui.h;

  let rec = null;
  let tick = null;
  const consent = {};
  const sending = {};

  function today() { return M3.store.get().today; }
  function fmtSec(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function todayRecs(ep) { return (ep.wardRecs || []).filter(function (r) { return r.at.slice(0, 10) === today(); }); }

  function stopTick() {
    if (tick) clearInterval(tick);
    tick = null;
  }

  function startRec(ep) {
    const script = M3.ai.wardScript(ep);
    const state = { epId: ep.id, start: Date.now(), elapsed: 0, paused: false, live: '' };
    try {
      // Ghi âm vẫn chạy khi AI gián đoạn; phần chép lời được giả lập bằng câu mẫu.
      state.ctrl = M3.ai.dictate(script.transcript, function (t) {
        state.live = t;
        const el = document.getElementById('m-live');
        if (el) el.textContent = t;
      }, function () { /* dừng bằng nút */ });
    } catch (e) {
      state.ctrl = { pause: function () {}, resume: function () {}, stop: function () {}, cancel: function () {} };
      state.live = '(AI gián đoạn — lưu bản ghi, chép lời khi AI hoạt động lại)';
    }
    rec = state;
    stopTick();
    tick = setInterval(function () {
      if (!rec || rec.paused) return;
      rec.elapsed++;
      const el = document.getElementById('m-timer');
      if (el) el.textContent = fmtSec(rec.elapsed);
    }, 1000);
    M3.app.render();
  }

  function finishRec(ep) {
    const st = M3.store.get();
    const r = rec;
    rec = null;
    stopTick();
    r.ctrl.cancel();
    const script = M3.ai.wardScript(ep);
    const entry = {
      id: M3.uid('W'), at: M3.now(), duration: fmtSec(Math.max(r.elapsed, 4)), transcript: script.transcript,
      status: st.toggles.offline || st.toggles.aiDown ? 'queued' : 'processing',
      reason: st.toggles.offline ? 'offline' : st.toggles.aiDown ? 'ai' : null,
    };
    // Đánh dấu đang gửi trước khi vẽ lại để flushQueue (afterRender) không gửi trùng.
    if (entry.status !== 'queued') sending[entry.id] = true;
    M3.store.update(function () { M3.sel.episode(ep.id).wardRecs.push(entry); });
    if (entry.status === 'queued') {
      ui.toast(entry.reason === 'offline' ? 'Mất mạng — đã lưu bản ghi trên máy, sẽ gửi khi có mạng' : 'AI gián đoạn — bản ghi chờ chép lời', 'warn');
    } else {
      process(ep.id, entry.id);
    }
  }

  // Gửi bản ghi: thêm nguồn ghi âm, gộp phần chép lời vào tờ hôm nay dưới dạng bản nháp AI.
  function process(epId, recId) {
    sending[recId] = true;
    setTimeout(function () {
      delete sending[recId];
      const ep = M3.sel.episode(epId);
      const entry = ep.wardRecs.find(function (x) { return x.id === recId; });
      if (!entry) return;
      const script = M3.ai.wardScript(ep);
      const sid = M3.uid('S');
      const date = entry.at.slice(0, 10);
      const sheet = ep.sheets[date];
      const locked = sheet && D.isLocked(sheet.status);
      M3.store.update(function () {
        const e = M3.sel.episode(epId);
        e.sources.push({ id: sid, type: 'audio', label: 'Ghi âm đi buồng ' + entry.at.slice(11, 16), at: entry.at, by: M3.sel.currentUser().id, content: entry.transcript, duration: entry.duration });
        const x = e.wardRecs.find(function (y) { return y.id === recId; });
        x.status = locked ? 'source_only' : 'merged';
        x.reason = null;
        x.sourceId = sid;
        M3.log(e, 'Gửi ghi âm đi buồng', entry.duration);
      }, { silent: true });
      if (!locked) {
        Object.keys(script.adds).forEach(function (fieldId) {
          const text = script.adds[fieldId];
          M3.sheetOps.insertContent(epId, date, fieldId, text, D.sentences(text).map(function (s) { return { sentence: s, sourceId: sid }; }),
            { mode: 'append', action: 'Gộp ghi âm đi buồng vào tờ (chờ duyệt)' });
        });
      }
      M3.app.render();
      ui.toast(locked ? 'Tờ hôm nay đã xác nhận — bản ghi lưu vào Nguồn dữ liệu' : 'Đã gộp vào tờ ' + ui.fmtShort(date) + ' — bác sĩ duyệt trên máy tính');
    }, 900);
  }

  function flushQueue() {
    const st = M3.store.get();
    if (st.toggles.offline || st.toggles.aiDown) return;
    st.episodes.forEach(function (ep) {
      (ep.wardRecs || []).forEach(function (r) {
        if ((r.status === 'queued' || r.status === 'processing') && !sending[r.id]) process(ep.id, r.id);
      });
    });
  }

  function recStatus(r) {
    if (sending[r.id] || r.status === 'processing') return h('span', { class: 'tag opt' }, 'Đang gửi…');
    if (r.status === 'queued') return h('span', { class: 'tag warn' }, r.reason === 'offline' ? 'Chờ gửi — mất mạng' : 'Chờ AI chép lời');

  function patientView(ep, ctx) {

  M3.screens.mobile = {
