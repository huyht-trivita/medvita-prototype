<script>/* js/app.js */
/* Khởi động, vẽ màn theo route, khung trang (topbar + điều hướng). */
(function (M3) {
  'use strict';

  const D = M3.domain;
  const ui = M3.ui;
  const h = ui.h;
  const app = M3.app = {};
  let root = null;
  let lastPath = null;
  const timers = {};

  const NAV = [
    { path: '/board', match: ['/board', '/episode'], label: 'Bảng quản lý điều trị', icon: 'grid', show: function (u) { return u.role !== 'admin'; } },
    { path: '/intake', label: 'Tạo bệnh nhân', icon: 'user-plus', show: function (u) { return D.can(u.role, 'patient.create'); } },
    { path: '/nursing', label: 'Phiếu chăm sóc', icon: 'activity', show: function (u) { return D.can(u.role, 'nursing.edit'); } },
    { path: '/reports', label: 'Báo cáo', icon: 'bar-chart', show: function (u) { return D.can(u.role, 'reports.view'); } },
    { sep: 'Quản trị', show: function (u) { return D.can(u.role, 'admin.templates'); } },
    { path: '/admin/templates', label: 'Cấu hình mẫu bệnh án', icon: 'layout', show: function (u) { return D.can(u.role, 'admin.templates'); } },
    { path: '/admin/integrations', label: 'Tích hợp (tùy chọn)', icon: 'database', show: function (u) { return D.can(u.role, 'admin.integrations'); } },
    { sep: 'Đi buồng', show: function (u) { return D.can(u.role, 'ward.record'); } },
    { path: '/m/ward', label: 'Màn đi buồng (mobile)', icon: 'smartphone', show: function (u) { return D.can(u.role, 'ward.record'); } },
  ];

  app.landing = function (user) {
    return user && user.role === 'admin' ? '/admin/templates' : '/board';
  };

  app.debounce = function (key, fn, ms) {
    clearTimeout(timers[key]);
    timers[key] = setTimeout(fn, ms || 600);
  };

  app.start = function () {
    M3.store.init();
    root = document.getElementById('app');
    const as = new URLSearchParams(location.search).get('as');
    if (as && M3.sel.user(as)) M3.store.update(function (s) { s.session.userId = as; }, { silent: true });
    window.addEventListener('hashchange', app.render);
    M3.store.subscribe(app.render);
    if (!location.hash || location.hash === '#' || location.hash === '#/') {
      const u = M3.sel.currentUser();
      history.replaceState(null, '', '#' + (u ? app.landing(u) : '/login'));
    }
    app.render();
  };

  function redirect(path) {
    history.replaceState(null, '', '#' + path);
    app.render();
  }

  app.render = function () {
    if (!root) return;
    const route = M3.router.parse(location.hash);
    const user = M3.sel.currentUser();
    if (!user && route.screen !== 'login') return redirect('/login');
    if (user && route.screen === 'login') return redirect(app.landing(user));
    if (user && user.role === 'admin' && route.screen === 'board') return redirect('/admin/templates');
    const screen = M3.screens[route.screen] || M3.screens.notfound;
    const ctx = { user: user, route: route, state: M3.store.get() };
    const focus = captureFocus();
    const y = window.scrollY;
    let content;
    try {
      content = screen.render(route.params, ctx);
    } catch (err) {
      console.error(err);
      content = h('div', { class: 'banner error', role: 'alert' }, ui.icon('alert'),
        h('div', null, h('strong', null, 'Lỗi hiển thị'), h('div', { class: 'small mono' }, String((err && err.message) || err))));
    }
    root.replaceChildren(screen.bare ? content : shell(ctx, route, content));
    if (M3.screens.demoPanel) root.appendChild(M3.screens.demoPanel.render(ctx));
    document.title = (screen.title ? screen.title(route.params, ctx) + ' · ' : '') + 'MedVita Module 3';
    if (lastPath === route.params.path) window.scrollTo(0, y);
    else window.scrollTo(0, 0);
    lastPath = route.params.path;
    restoreFocus(focus);
    if (screen.afterRender) screen.afterRender(route.params, ctx);
  };

  function captureFocus() {
    const el = document.activeElement;
    if (!el || !el.id || !root.contains(el)) return null;
    let start = null;
    let end = null;
    try { start = el.selectionStart; end = el.selectionEnd; } catch (e) { /* input không có selection */ }
    return { id: el.id, start: start, end: end };
  }

  function restoreFocus(f) {
    if (!f) return;
    const el = document.getElementById(f.id);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (typeof f.start === 'number' && el.setSelectionRange) {
      try { el.setSelectionRange(f.start, f.end); } catch (e) { /* bỏ qua */ }
    }
  }

  function logout() {
    M3.store.update(function (s) { s.session.userId = null; }, { silent: true });
    redirect('/login');
  }

  function shell(ctx, route, content) {
    const u = ctx.user;
    const t = ctx.state.toggles;
    const dept = M3.sel.dept(u.dept);
    const path = route.params.path || '';
    const top = h('header', { class: 'topbar' },
      h('a', { class: 'brand', href: '#' + app.landing(u) },
        h('div', { class: 'brand-mark' }, 'M'),
        h('div', null, h('div', { class: 'brand-name' }, 'MedVita'), h('div', { class: 'brand-sub' }, 'Module 3 · Hỗ trợ lập bệnh án'))),
      h('div', { class: 'spacer' }),
      t.aiDown ? h('span', { class: 'conn-chip warn' }, h('span', { class: 'dot' }), 'AI tạm gián đoạn') : null,
      h('span', { class: 'conn-chip' + (t.his ? ' on' : ''), title: t.his ? 'Bệnh viện đã bật tích hợp HIS / EMR' : 'Module 3 chạy độc lập; HIS / EMR là tích hợp tùy chọn' },
        h('span', { class: 'dot' }), t.his ? 'HIS / EMR đã kết nối' : 'Chạy độc lập · HIS chưa kết nối'),
      h('div', { class: 'hosp' }, ctx.state.hospital.name, h('br'), dept ? 'Khoa ' + dept.name : 'Toàn viện'),
      h('div', { class: 'user-box' },
        h('div', { class: 'avatar', 'aria-hidden': 'true' }, u.short),
        h('div', null, h('div', { class: 'user-name' }, u.name), h('div', { class: 'user-role' }, u.title))),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Đăng xuất', title: 'Đăng xuất', onClick: logout }, ui.icon('log-out')));
    const nav = h('nav', { class: 'sidenav', 'aria-label': 'Điều hướng chính' },
      NAV.filter(function (n) { return n.show(u); }).map(function (n) {
        if (n.sep) return h('div', { class: 'nav-sep' }, n.sep);
        const active = (n.match || [n.path]).some(function (m) { return path.indexOf(m) === 0; });
        return h('a', { class: 'nav-item' + (active ? ' active' : ''), href: '#' + n.path, title: n.label, 'aria-current': active ? 'page' : null }, ui.icon(n.icon), h('span', null, n.label));
      }),
      h('div', { class: 'nav-foot' }, 'Prototype · dữ liệu demo', h('br'), 'Master plan v0.5 · D-02 hướng 1'));
    return h('div', null, top, h('div', { class: 'layout' }, nav, h('main', { class: 'main', id: 'main' }, content)));
  }

  M3.screens.notfound = {
    title: function () { return 'Không tìm thấy'; },
    render: function (params) {
      return h('div', { class: 'card card-body stack' },
        h('h2', null, 'Không tìm thấy trang'),
        h('p', { class: 'muted mono' }, params.path || ''),
