<html lang="vi">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedVita Module 3 — Hỗ trợ lập bệnh án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>/* css/tokens.css */
:root {
  --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --ink: #16211F;
  --ink-2: #2C3A37;
  --muted: #6B7C78;
  --faint: #93A29E;
  --line: #E1E7E5;
  --line-2: #D6DEDB;
  --bg: #F1F4F3;
  --card: #FFFFFF;
  --soft: #FAFCFB;

  --brand-900: #0F2E2A;
  --brand-800: #1C4C45;
  --brand-700: #2E625A;
  --brand: #0E6E63;
  --brand-300: #8FD6C9;
  --brand-100: #E3F2EF;
  --brand-50: #F3FAF8;
  --mint: #4CC79E;

  --amber: #8A5A00;
  --amber-strong: #C08A16;
  --amber-bg: #FFF7E6;
  --amber-line: #F0D9A8;
  --red: #B42318;
  --red-bg: #FDECEA;
  --red-line: #F5C2BC;
  --blue: #1D5FD1;
  --blue-bg: #EAF1FF;
  --green: #127A4B;
  --green-bg: #E7F6EE;
  --violet: #6941C6;
  --violet-bg: #F2EEFC;

  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(15, 46, 42, .06), 0 6px 20px rgba(15, 46, 42, .07);
  --shadow-lg: 0 10px 40px rgba(15, 46, 42, .22);
  --topbar-h: 60px;
}
</style>
<style>/* css/app.css */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.topbar { position: sticky; top: 0; z-index: 40; height: var(--topbar-h); background: var(--brand-900); color: #E8F2F0; display: flex; align-items: center; gap: 16px; padding: 0 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand-800); color: var(--brand-300); display: grid; place-items: center; font-weight: 700; }
.brand-name { font-weight: 700; font-size: 16px; color: #F2FAF8; }
.brand-sub { font-size: 12px; color: #9CC6BF; }
.topbar .spacer { flex: 1; }
.hosp { font-size: 12px; color: #A9C9C3; text-align: right; line-height: 1.35; }
.conn-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: var(--brand-800); color: #CDE7E2; white-space: nowrap; }
.conn-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #9CC6BF; }
.conn-chip.on .dot { background: var(--mint); }
.conn-chip.warn { background: #4A3A12; color: #FBE3A8; }
.conn-chip.warn .dot { background: var(--amber-strong); }
.user-box { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-800); color: var(--brand-300); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
.user-name { font-size: 13.5px; font-weight: 600; color: #F2FAF8; }
.user-role { font-size: 12px; color: #9CC6BF; }
.topbar .icon-btn { color: #CDE7E2; }
.topbar .icon-btn:hover { background: var(--brand-800); color: #fff; }

.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); }
.sidenav { background: var(--card); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 13.5px; }
.nav-item:hover { background: var(--brand-50); }
.nav-item.active { background: var(--brand-100); color: var(--brand-900); font-weight: 600; }
.nav-sep { margin: 14px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.nav-foot { margin-top: auto; padding: 12px 12px 64px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.main { padding: 22px 26px 96px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { font-size: 21px; letter-spacing: -.01em; }
.page-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--soft); border-color: #C3CFCB; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #0B5E54; }
.btn.danger { color: var(--red); border-color: var(--red-line); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--brand-50); }
.btn.ai { background: var(--brand-50); border-color: #BFE3DB; color: var(--brand); }
.btn.ai:hover { background: var(--brand-100); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--brand-50); color: var(--ink); }
.ico { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ico svg { width: 100%; height: 100%; }

/* ---------- layout helpers ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); background: var(--soft); border-radius: var(--radius) var(--radius) 0 0; flex-wrap: wrap; }
.card-head h2, .card-head h3 { font-size: 15px; }
.card-body { padding: 16px 18px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.strong { font-weight: 600; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.pre { white-space: pre-wrap; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 16px; }
.stat-label { font-size: 12.5px; color: var(--muted); }
.stat-value { font-size: 24px; font-weight: 700; margin-top: 2px; }
.stat-note { font-size: 11.5px; color: var(--muted); }

/* ---------- badges, chips, tags ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: #EEF2F1; color: var(--ink-2); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.st-empty { background: #EEF2F1; color: #5D6D69; }
.st-draft { background: var(--amber-bg); color: var(--amber); }
.st-confirmed { background: var(--green-bg); color: var(--green); }
.st-exported { background: var(--brand-100); color: var(--brand); }
.st-sending { background: var(--blue-bg); color: var(--blue); }
.st-awaiting_sign { background: var(--violet-bg); color: var(--violet); }
.st-send_failed { background: var(--red-bg); color: var(--red); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 12.5px; cursor: pointer; color: var(--ink-2); text-decoration: none; }
.chip:hover { border-color: var(--brand-300); background: var(--brand-50); }
.chip.on { background: var(--brand-100); border-color: var(--brand-300); color: var(--brand-900); font-weight: 600; }
.chip[disabled] { opacity: .5; cursor: not-allowed; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: #EEF2F1; color: var(--ink-2); white-space: nowrap; }
.tag .ico { width: 12px; height: 12px; }
.tag.ai { background: var(--amber-bg); color: var(--amber); }
.tag.src { background: var(--brand-100); color: var(--brand); cursor: pointer; border: 0; font-family: inherit; }
.tag.src:hover { background: #D2EBE6; }
.tag.opt { background: var(--blue-bg); color: var(--blue); }
.tag.warn { background: var(--red-bg); color: var(--red); }
.tag.ok { background: var(--green-bg); color: var(--green); }

/* ---------- banners ---------- */
.banner { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 10px; font-size: 13px; border: 1px solid var(--line); background: var(--soft); }
.banner.info { background: var(--brand-50); border-color: #CBE7E1; color: var(--brand-900); }
.banner.warn { background: var(--amber-bg); border-color: var(--amber-line); color: #5F4100; }
.banner.error { background: var(--red-bg); border-color: var(--red-line); color: #7A1A12; }
.banner.violet { background: var(--violet-bg); border-color: #DCD2F7; color: #3E2683; }
.banner.blue { background: var(--blue-bg); border-color: #C9DAFB; color: #133E8A; }
.banner > .ico { margin-top: 2px; }
.banner .grow { flex: 1; min-width: 0; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.req { color: var(--red); margin-left: 2px; }
.input, .select, .textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); padding: 8px 10px; font-size: 14px; }
.textarea { min-height: 84px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14, 110, 99, .14); }
.input[readonly], .textarea[readonly] { background: var(--soft); color: var(--ink-2); }
.hint { font-size: 12px; color: var(--muted); }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 36px; height: 20px; border-radius: 999px; background: #C9D3D0; position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.switch input:checked + .track { background: var(--brand); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ---------- table ---------- */
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; background: var(--soft); border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 11px 12px; border-bottom: 1px solid #EDF1F0; vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--brand-50); }

/* ---------- progress ---------- */
.progress { height: 6px; border-radius: 999px; background: #E5ECEA; overflow: hidden; min-width: 70px; flex: 1; }
.progress > span { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
.progress.low > span { background: var(--amber-strong); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { padding: 10px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; background: none; border-top: 0; border-left: 0; border-right: 0; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--brand-900); border-bottom-color: var(--brand); }
.tab .count { font-size: 11px; background: #EEF2F1; border-radius: 999px; padding: 0 6px; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(12, 30, 27, .45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
.modal { width: min(560px, 100%); background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; max-height: 88vh; }
.modal-lg { width: min(860px, 100%); }
.modal-xl { width: min(1080px, 100%); }
.modal-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-head > .ico { width: 20px; height: 20px; color: var(--brand); margin-top: 2px; }
.modal-titles { flex: 1; min-width: 0; }
.modal-head h2 { font-size: 16px; }
.modal-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--soft); border-radius: 0 0 14px 14px; flex-wrap: wrap; }
.modal-note { margin-right: auto; font-size: 12px; color: var(--muted); max-width: 60%; }

/* ---------- toast ---------- */
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--brand-900); color: #E8F2F0; padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-lg); max-width: 380px; display: flex; gap: 8px; align-items: flex-start; animation: toast-in .18s ease-out; }
.toast.warn { background: #5C4209; }
.toast.error { background: #6E1A12; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EDF1F0; }
.list-item:last-child { border-bottom: 0; }
.empty { padding: 28px; text-align: center; color: var(--muted); font-size: 13px; }
.src-type { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; flex: none; background: var(--brand-100); color: var(--brand); }
.src-type.audio { background: #FCEFE3; color: #A35400; }
.src-type.document { background: var(--blue-bg); color: var(--blue); }
.src-type.nursing { background: var(--violet-bg); color: var(--violet); }
.src-type.his, .src-type.module1, .src-type.module2 { background: #EEF2F1; color: var(--ink-2); }

/* ---------- print ---------- */
#print-root { display: none; }
@media print {
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; font-size: 12pt; color: #000; }
  #print-root h1 { font-size: 15pt; text-align: center; margin: 6pt 0; }
  #print-root .p-head { display: flex; justify-content: space-between; font-size: 10.5pt; }
  #print-root .p-meta { margin: 6pt 0 10pt; font-size: 11pt; }
  #print-root table { width: 100%; border-collapse: collapse; }
  #print-root td, #print-root th { border: 1px solid #000; padding: 4pt 6pt; vertical-align: top; text-align: left; white-space: pre-wrap; }
  #print-root .p-sign { margin-top: 18pt; text-align: right; font-style: italic; }
}

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .layout { grid-template-columns: 64px minmax(0, 1fr); }
  .nav-item > span:not(.ico), .nav-sep, .nav-foot { display: none; }
  .nav-item { justify-content: center; padding: 10px; }
  .hosp { display: none; }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .user-box .user-name, .user-box .user-role, .conn-chip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
<style>/* css/mobile.css */
/* Màn đi buồng trên điện thoại (F3-076). Trên desktop hiển thị trong khung điện thoại. */
.m-stage { min-height: 100vh; background: radial-gradient(circle at 30% 20%, #1C4C45, #0F2E2A 62%); display: flex; align-items: center; justify-content: center; gap: 48px; padding: 24px; }
.m-side { color: #CDE7E2; max-width: 330px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.m-side h1 { color: #F2FAF8; font-size: 22px; }
.m-side ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.m-side a { color: var(--brand-300); }
.m-phone { width: 390px; height: min(820px, calc(100vh - 48px)); background: #F4F7F6; border-radius: 42px; border: 10px solid #0A1F1C; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); overflow: hidden; display: flex; flex-direction: column; position: relative; flex: none; }
.m-status { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 12px; font-weight: 600; background: var(--brand-900); color: #E8F2F0; flex: none; }
.m-head { background: var(--brand-900); color: #E8F2F0; padding: 8px 16px 14px; flex: none; }
.m-head h2 { font-size: 18px; color: #F2FAF8; }
.m-head a { color: #9CC6BF; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
.m-sub { font-size: 12px; color: #9CC6BF; }
.m-offline { background: #5C4209; color: #FBE3A8; font-size: 12.5px; padding: 8px 14px; display: flex; gap: 8px; align-items: center; flex: none; }
.m-body { flex: 1; overflow-y: auto; padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.m-room { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 6px 2px 0; }
.m-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; min-height: 44px; }
.m-card:hover { border-color: var(--brand-300); }
.m-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.m-name { font-weight: 600; font-size: 15px; }
.m-meta { font-size: 12px; color: var(--muted); }
.m-consent { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.m-consent input { width: 20px; height: 20px; margin-top: 1px; flex: none; }
.m-rec-btn { width: 116px; height: 116px; border-radius: 50%; border: 0; background: #D92D20; color: #fff; display: grid; place-items: center; margin: 6px auto 0; box-shadow: 0 8px 24px rgba(217, 45, 32, .35); cursor: pointer; }
.m-rec-btn .ico { width: 42px; height: 42px; }
.m-rec-btn[disabled] { background: #C9D3D0; box-shadow: none; cursor: not-allowed; }
.m-hint { text-align: center; font-size: 12.5px; color: var(--muted); }
.m-wave { display: flex; gap: 5px; align-items: center; justify-content: center; height: 44px; }
.m-wave span { width: 5px; height: 10px; border-radius: 3px; background: #D92D20; animation: m-wave 1s ease-in-out infinite; }
.m-wave span:nth-child(2) { animation-delay: .12s; } .m-wave span:nth-child(3) { animation-delay: .24s; } .m-wave span:nth-child(4) { animation-delay: .36s; }
.m-wave span:nth-child(5) { animation-delay: .48s; } .m-wave span:nth-child(6) { animation-delay: .6s; } .m-wave span:nth-child(7) { animation-delay: .72s; }

<div id="app"></div>

<noscript>Prototype cần bật JavaScript.</noscript>
<script>/* js/core/domain.js */
/* Logic thuần của Module 3: không đụng DOM, test được bằng node. */
(function (M3) {
  'use strict';

  const SHEET_FIELDS = [
    { id: 'dienbien', label: 'Diễn biến bệnh', required: true },
    { id: 'ylenh', label: 'Y lệnh', required: true },
    { id: 'chamsoc', label: 'Chăm sóc & theo dõi', required: false },
  ];

  const STATUS = {
    empty: 'Chưa điền',
    draft: 'Bản nháp',
    confirmed: 'Đã xác nhận',
    exported: 'Đã xuất',
    sending: 'Đang gửi HIS',
    send_failed: 'Gửi HIS lỗi',
    awaiting_sign: 'Chờ ký trên HIS',
  };

  const TRANSITIONS = {
    empty: ['draft'],
    draft: ['empty', 'confirmed'],
    confirmed: ['draft', 'exported', 'sending'],
    exported: ['draft', 'exported', 'sending'],
    sending: ['awaiting_sign', 'send_failed'],
    send_failed: ['sending', 'draft'],
    awaiting_sign: ['draft'],
  };

  function canTransition(from, to) {
    return (TRANSITIONS[from] || []).indexOf(to) !== -1;
  }

  function transition(doc, to) {
    if (!canTransition(doc.status, to)) {
      throw new Error('Không chuyển được từ "' + (STATUS[doc.status] || doc.status) + '" sang "' + (STATUS[to] || to) + '"');
    }
    doc.status = to;
    return doc;
  }

  function isLocked(status) {
    return status !== 'empty' && status !== 'draft';
  }

  function hasText(v) {
    return typeof v === 'string' && v.trim().length > 0;
  }

  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().normalize('NFC').replace(/\s+/g, ' ').trim();
  }

  function blockersForConfirm(defs, fields) {
    const out = [];
    defs.forEach(function (d) {
      const f = fields[d.id] || {};
      if (d.required && !hasText(f.text)) {
        out.push({ fieldId: d.id, label: d.label, reason: 'required', message: d.label + ': bắt buộc, chưa có nội dung' });
      }
      if (f.aiPending) {
        out.push({ fieldId: d.id, label: d.label, reason: 'ai_pending', message: d.label + ': còn nội dung AI chưa duyệt' });
      }
    });
    return out;
  }

  function completeness(template, fields) {
    let total = 0;
    let filled = 0;
    let required = 0;
    let requiredFilled = 0;
    const missing = [];
    template.sections.forEach(function (s) {
      s.fields.forEach(function (f) {
        total++;
        const ok = hasText((fields[f.id] || {}).text);
        if (ok) filled++;
        if (f.required) {
          required++;
          if (ok) requiredFilled++;
          else missing.push({ sectionId: s.id, fieldId: f.id, label: f.label });
        }
      });
    });
    return { total: total, filled: filled, required: required, requiredFilled: requiredFilled, pct: required ? Math.round(requiredFilled * 100 / required) : 100, missing: missing };
  }

  function sectionBlockers(section, doc) {
    const out = [];
    section.fields.forEach(function (f) {
      const v = doc.fields[f.id] || {};
      if (f.required && !hasText(v.text)) {
        out.push({ sectionId: section.id, fieldId: f.id, reason: 'required', message: section.title + ' › ' + f.label + ': bắt buộc, chưa có nội dung' });
      }
      if (v.aiPending) {
        out.push({ sectionId: section.id, fieldId: f.id, reason: 'ai_pending', message: section.title + ' › ' + f.label + ': nội dung AI chưa duyệt' });
      }
    });
    return out;
  }

  function recordBlockers(template, doc, opts) {
    const requireSections = !opts || opts.requireSections !== false;
    let out = [];
    template.sections.forEach(function (s) {
      out = out.concat(sectionBlockers(s, doc));
      if (requireSections && !(doc.sectionConfirm || {})[s.id]) {
        out.push({ sectionId: s.id, reason: 'section', message: s.title + ': chưa xác nhận phần này' });
      }
    });
    return out;
  }

  // ---------- Y lệnh ----------
  const DOSE_RE = /(\d+(?:[.,]\d+)?)\s*(mcg|µg|ug|mg|ml|g|ui|iu|đơn vị)(?![a-z])/i;
  const UNIT = { mcg: 'mcg', 'µg': 'mcg', ug: 'mcg', mg: 'mg', ml: 'ml', g: 'g', ui: 'UI', iu: 'UI', 'đơn vị': 'UI' };
  const TO_MG = { mcg: 0.001, mg: 1, g: 1000 };

  function findDrug(line, drugs) {
    const l = norm(line);
    return drugs.find(function (d) {
      return [d.name].concat(d.aliases || []).some(function (n) { return l.indexOf(norm(n)) === 0; });
    }) || null;
  }

  function timesPerDay(line) {
    const perDay = line.match(/(\d+)\s*lần\s*\/\s*ngày/i);
    if (perDay) return parseInt(perDay[1], 10);
    const clock = line.match(/\b\d{1,2}[:h]\d{2}\b/g);
    if (clock) return clock.length;
    const parts = line.match(/\b(sáng|trưa|chiều|tối)\b(?!\s*đa)/gi);
    if (parts) return new Set(parts.map(function (p) { return p.toLowerCase(); })).size;
    return 1;
  }

  function parseOrderLine(line, drugs) {
    const clean = String(line || '').replace(/^[\s\-•*]+/, '').replace(/^\d+[.)]\s+/, '').trim();
    if (!clean) return null;
    const m = clean.match(DOSE_RE);
    const drug = findDrug(clean, drugs);
    if (!m && !drug) return null;
    return {
      text: clean,
      drug: drug,
      dose: m ? parseFloat(m[1].replace(',', '.')) : null,
      unit: m ? UNIT[m[2].toLowerCase()] : null,
      timesPerDay: timesPerDay(clean),
    };
  }

  function fmtAmount(x, unit) {
    if (unit === 'mg' && x >= 1000 && x % 1000 === 0) return (x / 1000) + ' g';
    return (Math.round(x * 100) / 100) + ' ' + unit;
  }

  function toBase(dose, unit, drug) {
    if (unit === drug.baseUnit) return dose;
    if (TO_MG[unit] && TO_MG[drug.baseUnit]) return dose * TO_MG[unit] / TO_MG[drug.baseUnit];
    return null;
  }

  function checkOrders(text, drugs) {
    const out = [];
    String(text || '').split('\n').forEach(function (line, i) {
      const p = parseOrderLine(line, drugs);
      if (!p) return;
      const issues = [];
      if (!p.drug) {
        issues.push({ code: 'unknown', message: 'Không có trong danh mục thuốc — kiểm tra lại tên thuốc' });
      } else if (p.dose == null) {
        issues.push({ code: 'no_dose', message: 'Chưa ghi liều / hàm lượng của ' + p.drug.name });
      } else if (p.drug.units.indexOf(p.unit) === -1) {
        issues.push({ code: 'unit', message: 'Đơn vị "' + p.unit + '" không hợp lệ cho ' + p.drug.name + ' (dùng ' + p.drug.units.join(', ') + ')' });
      } else {
        const single = toBase(p.dose, p.unit, p.drug);
        const daily = single * p.timesPerDay;
        if (single > p.drug.maxSingle) {
          issues.push({ code: 'max_single', message: 'Liều mỗi lần ' + fmtAmount(single, p.drug.baseUnit) + ' vượt mức tối đa ' + fmtAmount(p.drug.maxSingle, p.drug.baseUnit) + ' (ngưỡng demo)' });
        } else if (daily > p.drug.maxDaily) {
          issues.push({ code: 'max_daily', message: 'Tổng liều / ngày ' + fmtAmount(daily, p.drug.baseUnit) + ' vượt mức tối đa ' + fmtAmount(p.drug.maxDaily, p.drug.baseUnit) + ' (ngưỡng demo)' });
        }
      }
      out.push({ lineNo: i + 1, line: p.text, drug: p.drug ? p.drug.name : null, issues: issues });
    });
    return out;
  }

  function orderIssues(text, drugs) {
    return checkOrders(text, drugs).filter(function (r) { return r.issues.length > 0; });
  }

  // ---------- So sánh và kế thừa ----------
  function splitLines(text) {
    return String(text || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function diffLines(prev, cur) {
    const a = splitLines(prev);
    const b = splitLines(cur);
    const n = a.length;
    const m = b.length;
    const dp = [];
    for (let i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) {
      for (let k = m - 1; k >= 0; k--) {
        dp[i][k] = norm(a[i]) === norm(b[k]) ? dp[i + 1][k + 1] + 1 : Math.max(dp[i + 1][k], dp[i][k + 1]);
      }
    }
    const out = [];
    let i = 0;
    let k = 0;
    while (i < n && k < m) {
      if (norm(a[i]) === norm(b[k])) { out.push({ type: 'same', text: b[k] }); i++; k++; }
      else if (dp[i + 1][k] >= dp[i][k + 1]) { out.push({ type: 'removed', text: a[i] }); i++; }
      else { out.push({ type: 'added', text: b[k] }); k++; }
    }
    while (i < n) out.push({ type: 'removed', text: a[i++] });
    while (k < m) out.push({ type: 'added', text: b[k++] });
    return out;
  }

  function prefixOf(x) {
    return typeof x === 'string' ? x : x.prefix;
  }

  function proposeInherited(prevFields, updates) {
    const out = {};
    SHEET_FIELDS.forEach(function (d) {
      const u = (updates && updates[d.id]) || {};
      const replace = u.replace || [];
      const drop = u.drop || [];
      const lines = splitLines((prevFields[d.id] || {}).text).map(function (t) {
        const r = replace.find(function (x) { return norm(t).indexOf(norm(x.prefix)) === 0; });
        if (r) return { text: r.text, old: t, kind: 'changed', sourceId: r.sourceId || null, checked: true };
        const dr = drop.find(function (x) { return norm(t).indexOf(norm(prefixOf(x))) === 0; });
        if (dr) return { text: t, kind: 'drop', sourceId: typeof dr === 'string' ? null : dr.sourceId || null, checked: false };
        return { text: t, kind: 'keep', sourceId: null, checked: true };
      });
      (u.add || []).forEach(function (a) {
        lines.push({ text: a.text, kind: 'new', sourceId: a.sourceId || null, checked: true });
      });
      out[d.id] = lines;
    });
    return out;
  }

  function applyProposal(lines) {
    return lines.filter(function (l) { return l.checked; }).map(function (l) { return l.text; }).join('\n');
  }

  function provenanceFromProposal(lines, fallbackSourceId) {
    return lines.filter(function (l) { return l.checked; }).map(function (l) {
      return { sentence: l.text, sourceId: l.sourceId || fallbackSourceId };
    });
  }

  // ---------- Phiên bản ----------
  function snapshotVersion(doc, meta) {
    doc.versions = doc.versions || [];
    doc.versions.push({
      version: doc.version || 1,
      status: doc.status,
      at: meta.at,
      by: meta.by,
      note: meta.note || '',
      fields: JSON.parse(JSON.stringify(doc.fields)),
    });
    doc.version = (doc.version || 1) + 1;
    return doc.version;
  }

  function reopen(doc, meta) {
    if (!isLocked(doc.status)) return doc.version || 1;
    if (!canTransition(doc.status, 'draft')) transition(doc, 'draft');
    snapshotVersion(doc, { by: meta.by, at: meta.at, note: meta.note || 'Mở lại để sửa' });
    doc.status = 'draft';
    if ('finalConfirm' in doc) doc.finalConfirm = null;
    return doc.version;
  }

  // ---------- Quyền ----------
  const DOCTOR = ['sheet.edit', 'sheet.editCare', 'sheet.confirm', 'sheet.export', 'record.edit', 'record.confirmSection', 'record.confirmFinal',
    'discharge.edit', 'discharge.confirm', 'patient.create', 'source.add', 'ai.use', 'ward.record'];
  const PERMS = {
    doctor: DOCTOR,
    head: DOCTOR.concat(['reports.view']),
    nurse: ['sheet.editCare', 'record.edit', 'record.confirmSection', 'nursing.edit', 'source.add', 'ai.use', 'patient.create'],
    admin: ['admin.templates', 'admin.integrations', 'reports.view'],
  };

  function can(role, perm) {
    return (PERMS[role] || []).indexOf(perm) !== -1;
  }

  // ---------- Nguồn ----------
  function sentences(text) {
    return String(text || '').split(/(?<=[.!?;])\s+|\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function findProvenance(provenance, selected) {
    const sel = norm(selected);
    if (!sel) return [];
    return (provenance || []).filter(function (p) {
      const s = norm(p.sentence);
      return s.indexOf(sel) !== -1 || sel.indexOf(s) !== -1;
    });
  }

  function unsourcedSentences(text, provenance) {
    return sentences(text).filter(function (s) {
      const ns = norm(s);
      return !(provenance || []).some(function (p) {
        const np = norm(p.sentence);
        return np.indexOf(ns) !== -1 || ns.indexOf(np) !== -1;
      });
    });
  }

  const OUT_OF_SCOPE = [
    /chẩn đoán\s*(là|gì|giúp|bệnh|phân biệt)|chẩn đoán\s*\?|gợi ý chẩn đoán/i,
    /kê đơn|kê thuốc/i,
    /nên (dùng|cho|uống|tiêm|truyền)/i,
    /thuốc gì/i,
    /điều trị (bằng gì|gì|thế nào|như thế nào)|hướng điều trị/i,
    /phác đồ/i,
    /(tăng|giảm|chỉnh) liều/i,
  ];

  function isOutOfScope(prompt) {
    return OUT_OF_SCOPE.some(function (r) { return r.test(String(prompt || '')); });
  }

  // ---------- Ngày ----------
  function dayNumber(from, to) {
    return Math.round((Date.parse(to) - Date.parse(from)) / 86400000) + 1;
  }

  function addDays(date, n) {
    return new Date(Date.parse(date) + n * 86400000).toISOString().slice(0, 10);
  }

  // ---------- Sinh hiệu ----------
  function parseVitals(text) {
    const t = String(text || '');
    const num = function (s) { return parseFloat(String(s).replace(',', '.')); };
    const out = {};
    let m;
    if ((m = t.match(/mạch\s*:?\s*(\d{2,3})/i))) out.pulse = num(m[1]);
    if ((m = t.match(/(?:huyết áp|HA)\s*:?\s*(\d{2,3})\s*\/\s*(\d{2,3})/i))) { out.bpSys = num(m[1]); out.bpDia = num(m[2]); }
    if ((m = t.match(/(?:nhiệt độ|nhiệt)\s*:?\s*(\d{2}(?:[.,]\d)?)/i))) out.temp = num(m[1]);
    if ((m = t.match(/SpO2\s*:?\s*(\d{2,3})/i))) out.spo2 = num(m[1]);
    if ((m = t.match(/nhịp thở\s*:?\s*(\d{1,2})/i))) out.resp = num(m[1]);
    if ((m = t.match(/VAS\s*:?\s*(\d{1,2})/i))) out.vas = num(m[1]);
    if ((m = t.match(/Morse\s*:?\s*(\d{1,3})/i))) out.morse = num(m[1]);
    return out;
  }

  // ---------- ICD-10 ----------
  function suggestIcd(text, list) {
    const out = [];
    (list || []).forEach(function (x) {
      const m = String(text || '').match(new RegExp(x.pattern, 'i'));
      if (m) out.push({ code: x.code, label: x.label, basis: m[0] });
    });
    return out;
  }

  // ---------- Tổng hợp và xuất ----------
  function combineSheets(sheets) {
    return Object.keys(sheets || {}).sort().map(function (d) {
      const s = sheets[d];
      return { date: s.date, time: s.time, status: s.status, dienbien: s.fields.dienbien.text, ylenh: s.fields.ylenh.text, chamsoc: s.fields.chamsoc.text };
    });
  }

  function patientBrief(patient) {
    return { id: patient.id, code: patient.code, name: patient.name, dob: patient.dob, sex: patient.sex, insurance: patient.insurance };
  }

  function episodeBrief(episode) {
    return { id: episode.id, dept: episode.dept, bed: episode.bed, admitted: episode.admitted, diagnosis: episode.diagnosis, icd: episode.icd };
  }

  function sheetExport(patient, episode, sheet) {
    return {
      schema: 'medvita.module3.treatment-sheet/v1',
      patient: patientBrief(patient),
      episode: episodeBrief(episode),
      sheet: {
        date: sheet.date, time: sheet.time, version: sheet.version || 1, status: sheet.status,
        dienbien: sheet.fields.dienbien.text, ylenh: sheet.fields.ylenh.text, chamsoc: sheet.fields.chamsoc.text,
        confirmedBy: sheet.confirmedBy, confirmedAt: sheet.confirmedAt,
      },
      note: 'Hồ sơ chính thức và chữ ký ở HIS / EMR.',
    };
  }

  function docExport(patient, episode, kind, template, doc) {
    const fields = {};
    template.sections.forEach(function (s) {
      s.fields.forEach(function (f) { fields[f.id] = { label: f.label, value: (doc.fields[f.id] || {}).text || '' }; });
    });
    return {
      schema: 'medvita.module3.' + kind + '/v1',
      template: { id: template.id || kind, title: template.title, version: template.version || null },
      patient: patientBrief(patient),
      episode: episodeBrief(episode),
      status: doc.status,
      version: doc.version || 1,
      finalConfirm: doc.finalConfirm || null,
      fields: fields,
      note: 'Hồ sơ chính thức và chữ ký ở HIS / EMR.',
    };
  }

  M3.domain = {
    SHEET_FIELDS: SHEET_FIELDS, STATUS: STATUS, TRANSITIONS: TRANSITIONS,
    canTransition: canTransition, transition: transition, isLocked: isLocked, hasText: hasText, norm: norm,
    blockersForConfirm: blockersForConfirm, completeness: completeness, sectionBlockers: sectionBlockers, recordBlockers: recordBlockers,
    parseOrderLine: parseOrderLine, checkOrders: checkOrders, orderIssues: orderIssues,
    splitLines: splitLines, diffLines: diffLines, proposeInherited: proposeInherited, applyProposal: applyProposal, provenanceFromProposal: provenanceFromProposal,
    snapshotVersion: snapshotVersion, reopen: reopen,
    PERMS: PERMS, can: can,
    sentences: sentences, findProvenance: findProvenance, unsourcedSentences: unsourcedSentences, isOutOfScope: isOutOfScope,
    dayNumber: dayNumber, addDays: addDays, parseVitals: parseVitals, suggestIcd: suggestIcd,
    combineSheets: combineSheets, sheetExport: sheetExport, docExport: docExport,
  };
})(window.M3 = window.M3 || {});
</script>
<script>/* js/data/demo.js */
/* Dữ liệu demo của prototype Module 3 — không phải dữ liệu thật. */
(function (M3) {
  'use strict';

  const VERSION = 1;
  const TODAY = '2026-10-11';
  const DEMO_PASSWORD = '123456';

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function field(text, extra) {
    return Object.assign({ text: text || '', aiPending: false, provenance: [], sourceIds: [] }, extra || {});
  }

  function emptySheet(date, time) {
    return {
      date: date, time: time || '08:00', status: 'empty', version: 1, versions: [],
      fields: { dienbien: field(''), ylenh: field(''), chamsoc: field('') },
      confirmedBy: null, confirmedAt: null, exportedAt: null, hisSentAt: null, savedAt: null,
    };
  }

  function sheet(date, time, by, status, dienbien, ylenh, chamsoc) {
    const s = emptySheet(date, time);
    s.status = status;
    s.fields.dienbien = field(dienbien);
    s.fields.ylenh = field(ylenh);
    s.fields.chamsoc = field(chamsoc);
    s.savedAt = date + 'T' + time;
    if (status !== 'empty' && status !== 'draft') {
      s.confirmedBy = by;
      s.confirmedAt = date + 'T' + time;
    }
    if (status === 'exported') s.exportedAt = date + 'T' + time;
    return s;
  }

  function src(id, type, label, at, by, content, extra) {
    return Object.assign({ id: id, type: type, label: label, at: at, by: by, content: content }, extra || {});
  }

  function f(id, label, type, required, extra) {
    return Object.assign({ id: id, label: label, type: type, required: Boolean(required), aiAllowed: true }, extra || {});
  }

  // ---------- Mẫu bệnh án ----------
  function hcSection(prefix) {
    return {
      id: 'hc', title: 'I. Hành chính', fields: [
        f('ho_ten', 'Họ và tên', 'text', true, { emrCode: prefix + '.HC.01' }),

    }
  }

    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));

  sel.patient = function (id) { return state.patients.find(function (p) { return p.id === id; }) || null; };
  sel.patientOf = function (ep) { return sel.patient(ep.patientId); };
  sel.dept = function (id) { return state.departments.find(function (d) { return d.id === id; }) || null; };
  sel.template = function (id) { return state.templates.find(function (t) { return t.id === id; }) || null; };
  sel.sources = function (ep) {
    const t = state.toggles;

        (opts.actions || []).map(function (a) {
          return h('button', { class: 'btn ' + (a.kind || ''), type: 'button', disabled: a.disabled, id: a.id, onClick: function () { a.onClick(api); } }, a.icon ? icon(a.icon) : null, a.label);
        }));
      box.appendChild(api.foot);
    }
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay && !opts.persistent) close(); });
    function onKey(e) {
      if (stack[stack.length - 1] !== api) return;
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Tab') trapFocus(e, box);
    }
    function close() {
      if (!overlay.isConnected) return;
      overlay.remove();
      document.removeEventListener('keydown', onKey, true);
      const i = stack.indexOf(api);
      if (i !== -1) stack.splice(i, 1);
      if (prev && prev.isConnected && prev.focus) prev.focus();
      if (opts.onClose) opts.onClose();
    }
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(overlay);
    stack.push(api);
    const first = box.querySelector('[autofocus]') || body.querySelector(FOCUSABLE) || box.querySelector(FOCUSABLE);
    if (first) first.focus();
    return api;
  }

  function confirm(o) {
    return new Promise(function (resolve) {
      let done = false;
      modal({
        title: o.title, icon: o.danger ? 'alert' : 'info',
        body: h('p', { class: 'pre' }, o.message),
        actions: [
          { label: 'Hủy', onClick: function (m) { m.close(); } },
          { label: o.okLabel || 'Đồng ý', kind: o.danger ? 'danger' : 'primary', onClick: function (m) { done = true; m.close(); resolve(true); } },
        ],
        onClose: function () { if (!done) resolve(false); },
      });
    });
  }

  // ---------- toast ----------
  function toast(message, kind) {
    let box = document.getElementById('toasts');
    if (!box) {
      box = h('div', { id: 'toasts', class: 'toasts', role: 'status', 'aria-live': 'polite' });
      document.body.appendChild(box);
    }
    const t = h('div', { class: 'toast' + (kind ? ' ' + kind : '') }, icon(kind === 'error' || kind === 'warn' ? 'alert' : 'check'), h('span', null, message));
    box.appendChild(t);
    setTimeout(function () { t.remove(); }, 3600);
  }

  // ---------- định dạng ----------
  function fmtDate(d) {
    if (!d) return '';
    const p = String(d).slice(0, 10).split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function fmtShort(d) {
    if (!d) return '';
    const p = String(d).slice(0, 10).split('-');
    return p[2] + '/' + p[1];
  }
  function fmtTime(dt) { return String(dt || '').slice(11, 16); }
  function fmtDT(dt) { return dt ? fmtTime(dt) + ' · ' + fmtShort(dt) : ''; }

  function userName(id) {
    if (!id) return '—';
    const u = M3.sel.user(id);
    return u ? u.name : id;
  }

  const ROLE = { doctor: 'Bác sĩ điều trị', nurse: 'Điều dưỡng', head: 'Trưởng khoa', admin: 'Quản trị' };
  const SRC = {
    manual: { icon: 'edit', label: 'Nhập tay' },
    document: { icon: 'file-text', label: 'Tài liệu' },
    audio: { icon: 'mic', label: 'Ghi âm' },
    nursing: { icon: 'activity', label: 'Điều dưỡng' },
    note: { icon: 'clipboard', label: 'Ghi chép' },
    his: { icon: 'database', label: 'HIS' },
    module1: { icon: 'link', label: 'Module 1' },
    module2: { icon: 'link', label: 'Module 2' },
    sheet: { icon: 'clipboard', label: 'Tờ điều trị' },
    patient: { icon: 'user', label: 'Hành chính' },
  };

  function badge(status) {
    return h('span', { class: 'badge st-' + status }, D.STATUS[status] || status);
  }

  function progress(pct) {
    return h('div', { class: 'progress' + (pct < 60 ? ' low' : ''), role: 'progressbar', 'aria-valuenow': pct, 'aria-valuemin': 0, 'aria-valuemax': 100 }, h('span', { style: { width: pct + '%' } }));
  }

  function switchEl(o) {
    return h('label', { class: 'switch' },
      h('input', { type: 'checkbox', id: o.id, checked: o.checked, disabled: o.disabled, onChange: function (e) { o.onChange(e.target.checked); } }),
      h('span', { class: 'track', 'aria-hidden': 'true' }),
      h('span', null, o.label));
  }

  function fieldBox(label, control, o) {
    o = o || {};
    return h('div', { class: 'field' + (o.class ? ' ' + o.class : '') },
      h('label', { for: control.id }, label, o.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null, o.extra || null),
      control,
      o.hint ? h('div', { class: 'hint' }, o.hint) : null);
  }

  function autoGrow(ta) {
    const fit = function () { ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight + 2, 64) + 'px'; };
    ta.addEventListener('input', fit);
    requestAnimationFrame(fit);
    return ta;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* bỏ qua */ }
    ta.remove();
  }

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  // ---------- nguồn ----------
  function srcTag(ep, sourceId) {
    const info = M3.sel.sourceInfo(ep, sourceId);
    if (!info) return null;
    const t = SRC[info.type] || SRC.manual;
    return h('button', { type: 'button', class: 'tag src', title: 'Xem nguồn: ' + info.label, onClick: function (e) { e.stopPropagation(); showSource(ep, sourceId); } }, icon(t.icon), info.label);
  }

  function provChips(ep, provenance) {
    const ids = [];
    (provenance || []).forEach(function (p) { if (p.sourceId && ids.indexOf(p.sourceId) === -1) ids.push(p.sourceId); });
    return ids.map(function (id) { return srcTag(ep, id); });
  }

  function showSource(ep, sourceId) {
    const info = M3.sel.sourceInfo(ep, sourceId);
    if (!info) return;
    const t = SRC[info.type] || SRC.manual;
    modal({
      title: info.label, icon: t.icon,
      subtitle: t.label + (info.at ? ' · ' + fmtDT(info.at) : '') + (info.by ? ' · ' + userName(info.by) : '') + (info.duration ? ' · ' + info.duration : ''),
      body: h('div', { class: 'stack' },
        info.requires ? h('div', { class: 'banner info' }, icon('link'), h('div', null, 'Nguồn từ tích hợp tùy chọn — chỉ có khi bệnh viện bật ' + (info.requires === 'his' ? 'HIS / EMR' : 'Module 1–2') + '.')) : null,
        h('div', { class: 'pre', style: { lineHeight: '1.7' } }, info.content || '(không có nội dung)'),
        info.file ? h('div', { class: 'tiny muted' }, 'Tệp: ' + info.file) : null),
      actions: [{ label: 'Đóng', onClick: function (m) { m.close(); } }],
    });
  }

  M3.ui = {
    h: h, icon: icon, style: style, modal: modal, confirm: confirm, toast: toast,
    fmtDate: fmtDate, fmtShort: fmtShort, fmtTime: fmtTime, fmtDT: fmtDT, userName: userName,
    ROLE: ROLE, SRC: SRC, badge: badge, progress: progress, switchEl: switchEl, fieldBox: fieldBox, autoGrow: autoGrow,
    copyText: copyText, download: download, srcTag: srcTag, provChips: provChips, showSource: showSource,
  };
})(window.M3 = window.M3 || {});
</script>
<script>/* js/core/router.js */
/* Route dạng hash: #/board, #/episode/E01/sheet/2026-10-11 … */
(function (M3) {
  'use strict';

  const ROUTES = [
    ['/login', 'login'],
    ['/board', 'board'],
    ['/intake', 'intake'],
    ['/episode/:id/:tab', 'episode'],
    ['/episode/:id/:tab/:date', 'episode'],
    ['/admin/templates', 'templates'],
    ['/admin/integrations', 'integrations'],
    ['/nursing', 'nursing'],
    ['/reports', 'reports'],
    ['/m/ward', 'mobile'],
    ['/m/patient/:id', 'mobile'],
  ];

  function match(path) {
    const segs = path.split('/').filter(Boolean);
    for (let r = 0; r < ROUTES.length; r++) {
      const ps = ROUTES[r][0].split('/').filter(Boolean);
      if (ps.length !== segs.length) continue;
      const params = {};
      let ok = true;
      ps.forEach(function (p, i) {
        if (p[0] === ':') params[p.slice(1)] = decodeURIComponent(segs[i]);
        else if (p !== segs[i]) ok = false;
      });
      if (ok) {
        params.path = path;
        return { screen: ROUTES[r][1], params: params };
      }
    }
    return null;
  }

  M3.router = {
    ROUTES: ROUTES,
    parse: function (hash) {
      const path = String(hash || '').replace(/^#/, '') || '/board';
      return match(path) || { screen: 'notfound', params: { path: path } };
    },
    go: function (path) {
      if (location.hash === '#' + path) M3.app.render();
      else location.hash = path;
    },
  };
})(window.M3 = window.M3 || {});
</script>
<script>/* js/core/ai-sim.js */
/* AI giả lập theo kịch bản: không gọi model thật, không dùng micro thật. */
(function (M3) {
  'use strict';

  const D = M3.domain;
  const DOWN_MSG = 'AI tạm gián đoạn. Bạn vẫn nhập tay, lưu, xác nhận và xuất bình thường.';

  function state() { return M3.store.get(); }
  function down() { return state().toggles.aiDown; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function AIError(code, message) {
    const e = new Error(message);
    e.code = code;
    return e;
  }

  async function guard(ms) {
    if (down()) throw AIError('AI_DOWN', DOWN_MSG);
    await wait(ms == null ? 600 + Math.random() * 500 : ms);
    if (down()) throw AIError('AI_DOWN', DOWN_MSG);
  }

  function script(ep) { return (M3.data.AI || {})[ep.id] || {}; }
  function shortDate(d) { return d.slice(8, 10) + '/' + d.slice(5, 7); }

  // Nguồn còn dùng được (nguồn từ tích hợp bị ẩn khi tắt tích hợp).
  function visible(ep, sourceId) {
    if (!sourceId) return true;
    if (sourceId.indexOf('sheet:') === 0 || sourceId === 'patient') return Boolean(M3.sel.sourceInfo(ep, sourceId));
    const s = M3.sel.source(ep, sourceId);
    return Boolean(s) && M3.sel.sources(ep).indexOf(s) !== -1;
  }

  function fromPairs(title, list) {
    return {
      kind: 'answer', title: title,
      text: list.map(function (p) { return p[0]; }).join('\n'),
      provenance: list.filter(function (p) { return p[1]; }).map(function (p) { return { sentence: p[0], sourceId: p[1] }; }),
    };
  }

  // ---------- Kế thừa tờ hôm trước ----------
  function filterUpdates(ep, inh) {
    const out = {};
    Object.keys(inh || {}).forEach(function (k) {
      const u = inh[k];
      out[k] = {
        replace: (u.replace || []).filter(function (x) { return visible(ep, x.sourceId); }),
        drop: (u.drop || []).filter(function (x) { return typeof x === 'string' || visible(ep, x.sourceId); }),
        add: (u.add || []).filter(function (x) { return visible(ep, x.sourceId); }),
      };
    });
    return out;
  }

  async function inheritProposal(ep, date) {
    await guard(900);
    const prev = M3.sel.prevSheet(ep, date);
    if (!prev) throw AIError('NO_PREV', 'Chưa có tờ điều trị trước đó để kế thừa.');
    return { prevDate: prev.date, lines: D.proposeInherited(prev.fields, filterUpdates(ep, script(ep).inherit)) };
  }

  // ---------- Tóm tắt ----------
  function genericSummary(ep, date, kind) {
    const list = [];
    const dates = M3.sel.sheetDates(ep).filter(function (d) { return d < date && ep.sheets[d].status !== 'empty'; });
    dates.slice(kind === '3d' ? -3 : -1).forEach(function (d) {
      const first = D.splitLines(ep.sheets[d].fields.dienbien.text)[0];
      if (first) list.push([shortDate(d) + ': ' + first, 'sheet:' + d]);
    });
    M3.sel.sources(ep).slice().sort(function (a, b) { return b.at.localeCompare(a.at); }).slice(0, 3).forEach(function (s) {
      const first = D.sentences(s.content)[0];
      if (first) list.push([first, s.id]);
    });
    if (!list.length) {
      throw AIError('NO_DATA', 'Chưa có dữ liệu nguồn cho bệnh nhân này (chưa có tờ điều trị trước, ghi âm hay tài liệu), nên tôi không tóm tắt để tránh suy đoán. Hãy nhập tay, đọc chính tả hoặc tải tài liệu ở tab Nguồn dữ liệu.');
    }
    return fromPairs(kind === '3d' ? 'Tóm tắt diễn biến gần đây' : 'Tóm tắt dữ liệu mới nhất', list);
  }

  async function summary(ep, date, kind) {
    await guard();
    const sc = script(ep)[kind === '3d' ? 'summary3d' : 'summary24h'];
    if (sc) {
      const list = sc.filter(function (p) { return visible(ep, p[1]); });
      if (list.length) return fromPairs(kind === '3d' ? 'Tóm tắt diễn biến 3 ngày gần nhất' : 'Tóm tắt 24 giờ qua', list);
    }
    return genericSummary(ep, date, kind);
  }

  // Gợi ý nội dung cho một ô của tờ điều trị.
  async function suggestField(ep, date, fieldId) {
    if (fieldId === 'dienbien') return summary(ep, date, '24h');
    await guard();
    const prev = M3.sel.prevSheet(ep, date);
    if (!prev) throw AIError('NO_DATA', 'Chưa có tờ trước hay dữ liệu nguồn để gợi ý ô này. Hãy nhập tay hoặc đọc chính tả.');
    const lines = D.proposeInherited(prev.fields, filterUpdates(ep, script(ep).inherit))[fieldId]
      .filter(function (l) { return l.checked; })
      .map(function (l) { return [l.text, l.sourceId || 'sheet:' + prev.date]; });
    if (!lines.length) throw AIError('NO_DATA', 'Tờ trước không có nội dung cho ô này.');
    return fromPairs('Gợi ý ' + (fieldId === 'ylenh' ? 'Y lệnh' : 'Chăm sóc & theo dõi') + ' từ tờ ' + shortDate(prev.date) + ' và dữ liệu mới', lines);
  }

  // ---------- Chat ----------
  async function chat(ep, date, prompt) {
    const p = String(prompt || '').trim();
    if (D.isOutOfScope(p)) {
      await guard(400);
      return { kind: 'refusal', text: 'Tôi không đưa ra chẩn đoán, gợi ý điều trị hay kê đơn — đó là quyết định của bác sĩ. Tôi có thể tóm tắt dữ liệu đã có, soạn nháp từ lời bác sĩ đọc, hoặc kiểm tra Y lệnh đã nhập.' };
    }
    const n = D.norm(p);
    if (/dựng|kế thừa|tờ hôm nay|tờ hôm trước/.test(n)) return { kind: 'action', action: 'inherit' };
    if (/24|hôm qua|qua đêm|đêm qua/.test(n)) return summary(ep, date, '24h');
    if (/tóm tắt|diễn biến|3 ngày|ba ngày/.test(n)) return summary(ep, date, '3d');
    if (/y lệnh|thuốc|liều/.test(n)) return { kind: 'action', action: 'checkOrders' };
    if (/nguồn|dữ liệu/.test(n)) {
      await guard(400);
      const srcs = M3.sel.sources(ep);
      if (!srcs.length) throw AIError('NO_DATA', 'Bệnh nhân này chưa có nguồn dữ liệu nào.');
      return { kind: 'info', title: 'Có ' + srcs.length + ' nguồn dữ liệu', text: srcs.map(function (s) { return '• ' + s.label; }).join('\n') };
    }
    await guard(400);
    return { kind: 'info', text: 'Tôi chưa hiểu yêu cầu. Bạn có thể thử: "Tóm tắt 24 giờ qua", "Tóm tắt diễn biến 3 ngày", "Dựng tờ hôm nay từ tờ hôm trước" hoặc "Kiểm tra Y lệnh".' };
  }

  // ---------- Đọc chính tả (giả lập: hiện dần câu mẫu) ----------
  function dictationText(ep, fieldId) {
    return (script(ep).dictation || {})[fieldId] || M3.data.AI_GENERIC.dictation[fieldId] || M3.data.AI_GENERIC.dictation.dienbien;
  }

  function dictate(text, onText, onDone) {
    if (down()) throw AIError('AI_DOWN', 'Nhận dạng giọng nói tạm gián đoạn — vui lòng gõ tay.');
    const words = text.split(' ');
    let i = 0;
    let paused = false;
    let stopped = false;
    let timer = null;
    function tick() {
      if (paused || stopped) return;
      i++;
      onText(words.slice(0, i).join(' '));
      if (i >= words.length) {
        stopped = true;
        onDone(words.join(' '));
        return;
      }
      timer = setTimeout(tick, 120);
    }
    timer = setTimeout(tick, 350);
    return {
      pause: function () { paused = true; clearTimeout(timer); },
      resume: function () { if (stopped || !paused) return; paused = false; timer = setTimeout(tick, 120); },
      stop: function () {
        if (stopped) return;
        stopped = true;
        clearTimeout(timer);
        onDone(words.slice(0, Math.max(i, 1)).join(' '));
      },
      cancel: function () { stopped = true; clearTimeout(timer); },
    };
  }

  // ---------- Tài liệu, HIS ----------
  async function extractDocument(fileName) {
    await guard(1300);
    const doc = M3.data.SAMPLE_DOC;
    return { fileName: fileName || doc.fileName, fields: JSON.parse(JSON.stringify(doc.fields)), content: doc.content };
  }

  async function hisLookup() {
    if (!state().toggles.his) throw AIError('NO_HIS', 'Chưa kết nối HIS. Bật ở Quản trị › Tích hợp (tùy chọn) hoặc Bảng demo.');
    await wait(700);
    return JSON.parse(JSON.stringify(M3.data.HIS_PATIENT));
  }

  // ---------- Soạn nháp bệnh án / hồ sơ ra viện ----------
  const GENERIC = {
    tom_tat_cls: function (s) { return s.type === 'document' || s.type === 'his'; },
    cls: function (s) { return s.type === 'document' || s.type === 'his'; },
    ts_ban_than: function (s) { return s.type === 'manual' && /tiền sử/i.test(s.content); },
    toan_than: function (s) { return s.type === 'nursing'; },
  };

  function genericField(ep, fieldId) {
    if (!GENERIC[fieldId]) return null;
    const srcs = M3.sel.sources(ep).filter(GENERIC[fieldId]).sort(function (a, b) { return b.at.localeCompare(a.at); }).slice(0, 2);
    if (!srcs.length) return null;
    return srcs.map(function (s) { return [D.sentences(s.content).slice(0, 2).join(' '), s.id]; });
  }

  async function draftFields(ep, template, doc, opts) {
    await guard(1100);
    const sc = opts.kind === 'record' ? (script(ep).record || {}) : ((script(ep).discharge || {})[opts.kind] || {});
    const out = { filled: [], skipped: [] };
    template.sections.forEach(function (s) {
      if (opts.sectionId && s.id !== opts.sectionId) return;
      s.fields.forEach(function (f) {
        if (D.hasText((doc.fields[f.id] || {}).text)) return;
        if (f.aiAllowed === false) { out.skipped.push({ fieldId: f.id, label: f.label, reason: 'Bác sĩ nhập — AI không điền mục này' }); return; }
        if (f.aiAllowed === 'suggest') { out.skipped.push({ fieldId: f.id, label: f.label, reason: 'Dùng nút "Gợi ý mã" — AI chỉ gợi ý kèm căn cứ' }); return; }
        let list = sc[f.id] || null;
        if (!list && s.id === 'hc') {
          const v = M3.data.hcPrefill(M3.sel.patientOf(ep))[f.id];
          list = v ? [[v, 'patient']] : null;
        }
        if (!list) list = genericField(ep, f.id);
        if (list) list = list.filter(function (p) { return p[1] == null || visible(ep, p[1]); });
        if (!list || !list.length) { out.skipped.push({ fieldId: f.id, label: f.label, reason: 'Không đủ dữ liệu nguồn — để trống, không suy đoán' }); return; }
        out.filled.push({
          fieldId: f.id,
          text: list.map(function (p) { return p[0]; }).join(' '),
          provenance: list.filter(function (p) { return p[1]; }).map(function (p) { return { sentence: p[0], sourceId: p[1] }; }),
        });
      });
    });
    return out;
  }

  async function selfCheck(ep, template, doc, kind) {
    await guard(900);
    const issues = [];
    template.sections.forEach(function (s) {
      s.fields.forEach(function (f) {
        const v = doc.fields[f.id];
        if (!v || !v.aiFilled || !D.hasText(v.text)) return;
        D.unsourcedSentences(v.text, v.provenance).forEach(function (sen) {
          issues.push({ fieldId: f.id, label: f.label, message: 'Câu "' + sen + '" không tìm thấy trong nguồn — kiểm tra lại hoặc xóa.' });
        });
      });
    });
    if (kind === 'record') {
      (script(ep).selfCheck || []).forEach(function (x) {
        const v = doc.fields[x.fieldId];
        if (v && D.hasText(v.text)) {
          const f = template.sections.reduce(function (acc, s) { return acc || s.fields.find(function (ff) { return ff.id === x.fieldId; }); }, null);
          issues.push({ fieldId: x.fieldId, label: f ? f.label : x.fieldId, message: x.message });
        }
      });
    }

(function (M3) {
  'use strict';

  const D = M3.domain;
  const ui = M3.ui;
  const h = ui.h;

  ui.style('intake', `
.intake-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.input.ai-filled, .select.ai-filled, .textarea.ai-filled { border-color: var(--amber-strong); background: #FFFCF4; }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--red); }
.drop { border: 1.5px dashed #BFD3CE; border-radius: 12px; padding: 16px; text-align: center; background: var(--soft); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.doc-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.doc-item .row { gap: 6px; }
.err-box { border: 1px solid var(--red-line); background: var(--red-bg); color: #7A1A12; border-radius: 10px; padding: 10px 14px; font-size: 13px; }
.err-box ul { margin: 4px 0 0; padding-left: 18px; }
@media (max-width: 1100px) { .intake-grid { grid-template-columns: 1fr; } }
`);

  const LABELS = {
    name: 'Họ và tên', dob: 'Ngày sinh', sex: 'Giới', job: 'Nghề nghiệp', address: 'Địa chỉ', insurance: 'Số thẻ BHYT', relative: 'Người nhà khi cần báo tin',
    dept: 'Khoa', bed: 'Buồng / giường', admitted: 'Ngày vào khoa', doctorId: 'Bác sĩ điều trị', nurseId: 'Điều dưỡng phụ trách', templateId: 'Mẫu bệnh án',
    diagnosis: 'Chẩn đoán vào khoa', history: 'Tiền sử, bệnh sử',
  };
  const REQUIRED = ['name', 'dob', 'sex', 'dept', 'bed', 'doctorId', 'templateId', 'diagnosis'];
  let draft = null;
  let errors = [];
  let busy = '';

  function fresh(ctx) {
    const dept = ctx.user.dept || ctx.state.departments[0].id;
    return {
      name: '', dob: '', sex: '', job: '', address: '', insurance: '', relative: '',
      dept: dept, bed: '', admitted: ctx.state.today,
      doctorId: ctx.user.role === 'doctor' ? ctx.user.id : '', nurseId: ctx.user.role === 'nurse' ? ctx.user.id : '',

  function fillEmpty(values, origin) {
    const skipped = [];
    Object.keys(values).forEach(function (k) {
      if (!(k in LABELS) || !values[k]) return;
      if (D.hasText(draft[k]) && draft[k] !== values[k]) { skipped.push(LABELS[k]); return; }
      draft[k] = values[k];
      draft.ai[k] = origin;
    });
    return skipped;
  }

  function input(key, attrs) {
    const el = h(attrs && attrs.tag === 'textarea' ? 'textarea' : 'input', Object.assign({
      class: (attrs && attrs.tag === 'textarea' ? 'textarea' : 'input') + (draft.ai[key] ? ' ai-filled' : ''), id: 'in-' + key, value: draft[key],
      'aria-invalid': errors.indexOf(key) !== -1 ? 'true' : null,
      onInput: function (e) { setField(key, e.target.value); e.target.classList.remove('ai-filled'); const t = document.getElementById('aitag-' + key); if (t) t.remove(); },
    }, attrs || {}));
    if (attrs && attrs.tag === 'textarea') ui.autoGrow(el);
    return el;
  }

  function select(key, options, onChange) {
    return h('select', {
      class: 'select' + (draft.ai[key] ? ' ai-filled' : ''), id: 'in-' + key, value: draft[key], 'aria-invalid': errors.indexOf(key) !== -1 ? 'true' : null,
      onChange: function (e) { setField(key, e.target.value, false); if (onChange) onChange(e.target.value); M3.app.render(); },
    }, h('option', { value: '' }, '— Chọn —'), options.map(function (o) { return h('option', { value: o[0] }, o[1]); }));
  }

  function box(key, control, extra) {
    return ui.fieldBox(LABELS[key], control, {
      required: REQUIRED.indexOf(key) !== -1,
      class: extra && extra.full ? 'full' : '',
      hint: extra && extra.hint,
      extra: draft.ai[key] ? h('span', { class: 'tag ai', id: 'aitag-' + key, style: { marginLeft: '6px' } }, draft.ai[key]) : null,
    });
  }

  async function useDocument(fileName) {
    busy = 'Đang trích dữ liệu từ ' + fileName + '…';
    M3.app.render();
    try {
      const r = await M3.ai.extractDocument(fileName);
      draft.docs.push({ fileName: r.fileName, content: r.content, fields: r.fields });
      const skipped = fillEmpty({ name: r.fields.name, dob: r.fields.dob, sex: r.fields.sex, address: r.fields.address, insurance: r.fields.insurance, diagnosis: r.fields.diagnosis, history: r.fields.history }, 'AI trích từ tài liệu — kiểm tra');

              : h('span', { class: 'tag opt', title: 'Bật ở Quản trị › Tích hợp hoặc Bảng demo' }, ui.icon('database'), 'Lấy từ HIS — tùy chọn, chưa kết nối'))),

        errors.length ? h('div', { class: 'err-box', role: 'alert', style: { marginBottom: '12px' } }, h('strong', null, 'Còn thiếu thông tin bắt buộc:'),

              h('div', { class: 'card-body form-grid' },
                box('name', input('name', { autocomplete: 'off' }), { full: true }),

<script>/* js/screens/episode.js */
/* Hồ sơ đợt điều trị: đầu trang bệnh nhân + các tab. */
(function (M3) {
  'use strict';

  const D = M3.domain;
  const ui = M3.ui;
  const h = ui.h;

  ui.style('episode', `
.ep-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
.ep-head > div:first-child { flex: 1 1 520px; min-width: 0; }
.ep-back { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); text-decoration: none; margin-bottom: 6px; }
.ep-back:hover { color: var(--brand); }
.ep-name { font-size: 21px; font-weight: 700; letter-spacing: -.01em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ep-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.ep-meta .tag { font-weight: 500; background: var(--card); border: 1px solid var(--line); }
.ep-side { margin-left: auto; display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.ep-rec { min-width: 210px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
`);

  const TABS = [
    { id: 'sheet', label: 'Tờ điều trị', icon: 'clipboard' },
    { id: 'record', label: 'Bệnh án', icon: 'file-text' },
    { id: 'sources', label: 'Nguồn dữ liệu', icon: 'database' },
    { id: 'discharge', label: 'Ra viện', icon: 'log-out' },
    { id: 'history', label: 'Lịch sử', icon: 'clock' },
  ];

  M3.screens.episode = {
    title: function (params) {
      const ep = M3.sel.episode(params.id);
      return ep ? M3.sel.patientOf(ep).name : 'Hồ sơ';
    },
    render: function (params, ctx) {
      const ep = M3.sel.episode(params.id);
      if (!ep) return M3.screens.notfound.render({ path: params.path });
      const p = M3.sel.patientOf(ep);
      const today = ctx.state.today;
      const tpl = M3.sel.template(ep.templateId);
      const comp = D.completeness(tpl, ep.record.fields);
      const tab = TABS.some(function (t) { return t.id === params.tab; }) ? params.tab : 'sheet';
      const dept = M3.sel.dept(ep.dept);

      const head = h('div', { class: 'ep-head' },
        h('div', null,
          h('a', { class: 'ep-back', href: '#/board' }, ui.icon('arrow-left'), 'Bảng quản lý điều trị'),
          h('div', { class: 'ep-name' }, p.name,
            ep.status === 'discharging' ? h('span', { class: 'tag opt' }, 'Sắp ra viện') : null,
            ep.status === 'discharged' ? h('span', { class: 'tag' }, 'Đã ra viện') : null),
          h('div', { class: 'ep-meta' },
            h('span', { class: 'tag' }, M3.sel.age(p) + ' tuổi · ' + p.sex),
            h('span', { class: 'tag' }, p.code),
            h('span', { class: 'tag' }, 'Giường ' + ep.bed),
            h('span', { class: 'tag' }, 'Khoa ' + dept.name),
            h('span', { class: 'tag' }, 'Ngày điều trị thứ ' + D.dayNumber(ep.admitted, today) + ' · vào ' + ui.fmtDate(ep.admitted)),
            h('span', { class: 'tag' }, ep.diagnosis + (ep.icd ? ' · ' + ep.icd : '')),
            h('span', { class: 'tag' }, ui.userName(ep.doctorId)))),
        h('div', { class: 'ep-side' },
          h('a', { class: 'ep-rec', href: '#/episode/' + ep.id + '/record', style: { textDecoration: 'none', color: 'inherit' } },
            h('span', { class: 'muted' }, 'Bệnh án · ' + tpl.title),
            h('div', { class: 'row', style: { flexWrap: 'nowrap' } }, ui.progress(comp.pct), h('strong', null, comp.pct + '%')),
            h('span', { class: 'muted' }, ep.record.finalConfirm ? '✓ Đã xác nhận cuối' : comp.requiredFilled + '/' + comp.required + ' trường bắt buộc')),
          D.can(ctx.user.role, 'ward.record') ? h('a', { class: 'btn', href: '#/m/patient/' + ep.id, title: 'Mở màn đi buồng trên điện thoại' }, ui.icon('smartphone'), 'Đi buồng') : null));

      const srcCount = M3.sel.sources(ep).length;
      const tabs = h('nav', { class: 'tabs', 'aria-label': 'Hồ sơ đợt điều trị' }, TABS.map(function (t) {
        const href = '#/episode/' + ep.id + '/' + t.id + (t.id === 'sheet' ? '/' + today : '');
        return h('a', { class: 'tab' + (t.id === tab ? ' active' : ''), href: href, 'aria-current': t.id === tab ? 'page' : null },
          ui.icon(t.icon), t.label, t.id === 'sources' ? h('span', { class: 'count' }, String(srcCount)) : null);
      }));

      const impl = M3.tabs[tab];
      const body = impl ? impl.render(ep, params, ctx) : h('div', { class: 'card card-body empty' }, 'Tab này đang được dựng.');
      return h('div', null, head, tabs, body);
    },
    afterRender: function (params, ctx) {
      const impl = M3.tabs[params.tab];
      if (impl && impl.afterRender) impl.afterRender(params, ctx);
    },
  };
})(window.M3 = window.M3 || {});
</script>

.inh-line:last-child { border-bottom: 0; }

.inh-line.drop { background: #FDF3F2; }

.inh-old { font-size: 12px; color: var(--muted); text-decoration: line-through; margin-top: 2px; }
